.dpv-scr .ic-circle{width:38px;height:38px;border-radius:50%;background:var(--teal-3);color:var(--ink);display:grid;place-items:center;flex:none}
.dpv-scr .tip{margin-top:22px;padding:14px 16px;border-radius:var(--r-md);background:var(--teal-3);display:flex;gap:12px;font-weight:500;font-size:14px;line-height:1.5}
.dpv-scr .sheet-grab{width:40px;height:5px;border-radius:5px;background:var(--line-2);margin:8px auto 0;flex:none}
.dpv-scr .sheet-head{display:flex;align-items:center;gap:10px;padding:10px 18px 6px;flex:none}
.dpv-scr .sheet-head h2{flex:1;margin:0;font-size:19px;font-weight:600;line-height:1.25}
.dpv-scr .sheet-body{overflow-y:auto;padding:8px 18px calc(22px + 0px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dpv-scr .tagchip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--teal-3);color:var(--ink);font-size:12px;font-weight:600}
.dpv-scr .lgo{position:relative;display:grid;place-items:center;flex:none;border-radius:50%;overflow:hidden;background:var(--teal-3);color:var(--teal-ink);font-weight:700}
.dpv-scr .lgo .plogo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.dpv-scr .offer .oh .lgo{width:28px;height:28px;font-size:12px;margin-right:2px}
.dpv-scr .offer .oh .ocat{flex:1;min-width:0}
.dpv-scr .oown{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);min-width:0}
.dpv-scr .oown .lgo{width:22px;height:22px;font-size:10px}
.dpv-scr .oown span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpv-scr .perk .pk{position:relative;overflow:hidden}
.dpv-scr .perk .pk .plogo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.dpv-scr .co-head{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.dpv-scr .co-head .lgo{width:52px;height:52px;font-size:18px}
.dpv-scr .co-own{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface)}
.dpv-scr .co-own .lgo{width:36px;height:36px;font-size:13px}
.dpv-scr .offer{flex:none;width:min(248px,72vw);scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);text-align:left;position:relative}
.dpv-scr .offer:hover{border-color:var(--line-2)}
.dpv-scr .offer.wide{width:100%}
.dpv-scr .offer .oh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dpv-scr .offer .ocat{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpv-scr .offer .ot{font-weight:600;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dpv-scr .offer .oc{font-size:12.5px;color:var(--ink-2)}
.dpv-scr .offer .od{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:auto}
.dpv-scr .obadge{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--teal);color:var(--on-teal);font-size:12px;font-weight:700;white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.dpv-scr .oloc{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.dpv-scr .oloc .body{flex:1;min-width:0}
.dpv-scr .oloc .t{font-weight:600;font-size:14px}
.dpv-scr .oloc .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.dpv-scr .kmh{display:inline-flex;align-items:center;gap:.26em;white-space:nowrap;font-variant-numeric:tabular-nums}
.dpv-scr .kmh>svg.mark{width:.95em;height:.95em;flex:none}
.dpv-scr .kmh.lg>svg.mark{width:.6em;height:.6em}
.dpv-scr .kmh-u{font-size:.5em;font-weight:500;color:var(--ink-2);letter-spacing:0;margin-left:.1em}
.dpv-scr .perk{display:flex;flex-direction:column;gap:8px;width:100%;padding:14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);text-align:left;position:relative}
.dpv-scr .perk:hover{border-color:var(--line-2)}
.dpv-scr .perk .ph{display:flex;align-items:center;gap:10px;min-width:0}
.dpv-scr .perk .pk{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--teal-3);color:var(--ink);flex:none}
.dpv-scr .perk .pk.helper{background:var(--ink);color:var(--on-ink)}
.dpv-scr .perk .pc{flex:1;min-width:0}
.dpv-scr .perk .pco{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.dpv-scr .perk .pm{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:1px}
.dpv-scr .perk .pt{font-weight:600;font-size:15px;line-height:1.3}
.dpv-scr .perk .pf{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:auto}
.dpv-scr .perk .price{font-weight:300;font-size:24px;line-height:1;letter-spacing:-.01em}
.dpv-scr .perk .tags{display:flex;flex-wrap:wrap;gap:6px}
.dpv-scr .perk.locked .pt,.dpv-scr .perk.locked .price{color:var(--ink-2)}

/* phone preview */
.phone-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.phone{width:300px;max-width:100%;border-radius:44px;padding:10px;background:#101516;box-shadow:0 30px 60px rgba(0,0,0,.18),inset 0 0 0 2px #2b3334}
.phone-screen{position:relative;border-radius:35px;overflow:hidden;background:#fff;color:#231F20;min-height:560px;display:flex;flex-direction:column;font-size:13px}
.ph-status{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 6px;font-size:12px;font-weight:600}
.ph-status .notch{width:86px;height:24px;border-radius:14px;background:#101516;position:absolute;left:50%;top:9px;transform:translateX(-50%)}
.ph-bar{padding:8px 16px 4px}
.ph-bar .e{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#56605F}
.ph-bar .h{font-weight:300;font-size:22px;letter-spacing:-.01em;margin-top:2px}
.ph-chips{display:flex;gap:6px;padding:8px 16px 6px;overflow:hidden}
.ph-chips span{height:26px;padding:0 10px;border-radius:999px;background:#F3F7F7;color:#56605F;font-size:11px;font-weight:600;display:inline-flex;align-items:center;white-space:nowrap}
.ph-chips span.on{background:#231F20;color:#fff}
.ph-card{margin:8px 12px;padding:14px;border-radius:18px;border:1px solid #E2EAE9;background:#fff;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;isolation:isolate}
.ph-card .ring{position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;border:1.5px solid #C9E9E6;z-index:-1}
.ph-head{display:flex;align-items:center;gap:10px}
.ph-logo{width:36px;height:36px;border-radius:50%;background:#EEF7F6;display:grid;place-items:center;font-weight:700;font-size:12px;color:#1F6E69;flex:none}
.ph-head .n{font-weight:600;font-size:13px;line-height:1.2;overflow-wrap:anywhere}
.ph-head .c{font-size:11px;color:#56605F}
.ph-badge{margin-left:auto;background:#96D5D2;color:#231F20;font-weight:700;font-size:12px;border-radius:999px;padding:4px 9px;white-space:nowrap;flex:none}
.ph-badge.ink{background:#231F20;color:#fff}
.ph-title{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.ph-text{font-size:12.5px;color:#56605F;line-height:1.45;overflow-wrap:anywhere;white-space:pre-line}
.ph-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:#86908F}
.ph-btn{height:38px;border-radius:999px;background:#231F20;color:#fff;font-weight:600;font-size:12.5px;display:grid;place-items:center;margin-top:2px}
.ph-card.ghost{opacity:.45}
.ph-card.ghost .ph-title{font-size:13px}
.ph-push{position:absolute;left:10px;right:10px;top:40px;z-index:3;border-radius:18px;padding:10px 12px;background:rgba(245,247,247,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;gap:10px;align-items:flex-start;animation:up .3s ease}
.ph-push .ai{width:30px;height:30px;border-radius:8px;background:#96D5D2;display:grid;place-items:center;flex:none}
.ph-push .pt{font-size:11px;color:#56605F;display:flex;justify-content:space-between;gap:8px}
.ph-push .pb{font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.ph-push .pc{font-size:12px;color:#56605F;line-height:1.3;overflow-wrap:anywhere}
.ph-tab{margin-top:auto;border-top:1px solid #E2EAE9;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px 14px}
.ph-tab span{height:24px;display:grid;place-items:center;color:#86908F}
.ph-tab span.on{color:#231F20}
.ph-tab span.on i{background:#C9E9E6}
.ph-tab i{width:40px;height:24px;border-radius:999px;display:grid;place-items:center}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r-lg)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.tbl th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600;text-align:right;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:12px 14px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:first-child td{border-top:0}
.tbl td:first-child{font-weight:600;max-width:280px;overflow-wrap:anywhere}
.chart-box{position:relative;height:240px;min-width:0;width:100%}
.chart-empty{position:absolute;left:0;right:0;top:0;bottom:48px;display:grid;place-items:center;text-align:center;color:var(--ink-2);font-size:13px;line-height:1.5;padding:20px 40px;pointer-events:none}
.chart-empty span{background:var(--card);padding:8px 12px;border-radius:10px;max-width:36ch}
@media (min-width:960px){.chart-box{height:280px}}

/* checklist */
.todo{display:flex;flex-direction:column;gap:2px}
.todo-h{font-weight:300;font-size:clamp(19px,5.4vw,22px);margin:4px 0 0;line-height:1.2}
.todo a{display:flex;align-items:center;gap:14px;padding:12px 4px;text-decoration:none;color:inherit;border-radius:12px}
.todo a:hover{background:var(--surface)}
.todo .ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;flex:none;color:transparent}
.todo .done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.todo .done .tt{text-decoration:line-through;color:var(--ink-3)}
.todo .tt{font-weight:600;font-size:14.5px}
.todo .td{font-size:12.5px;color:var(--ink-2)}
.prog-ring{width:64px;height:64px;flex:none}
.qr-box{display:grid;place-items:center;padding:16px;background:#fff;border-radius:18px;border:1px solid var(--line);width:fit-content;margin:0 auto}
.qr-box svg,.qr-box img{width:220px;height:220px;display:block}
pre.inv{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.55;background:var(--surface);border-radius:14px;padding:14px;margin:0;overflow-wrap:anywhere}
.more-list .item{min-height:58px}
.bal-card{position:relative;overflow:hidden;isolation:isolate}
.bal-card .rings{width:300px;right:-150px;top:-150px}
.bal-card .rings i{border-color:rgba(150,213,210,.35)}
.bal-card .rings i:nth-child(3){border-color:var(--teal)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.presets{grid-template-columns:repeat(2,1fr)}}
.preset{height:48px;border-radius:14px;background:var(--surface);font-weight:600;font-variant-numeric:tabular-nums;border:1.5px solid transparent}
.preset[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.role-sel{height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:0 30px 0 12px;font-size:13px;font-weight:600;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px;background-size:5px 5px;background-repeat:no-repeat}
.loader{display:grid;place-items:center;padding:60px 0}
.loader .spin{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--teal-2);border-top-color:var(--teal-ink);animation:rot .8s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
/* ---------- языки: переключатель RU · RO · EN ---------- */
.lsw{display:inline-flex;align-items:center;gap:1px;padding:3px;border-radius:999px;background:var(--surface);flex:none}
.lsw button{height:28px;min-width:30px;padding:0 6px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-2)}
.lsw button:hover{color:var(--ink)}
.lsw button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lsw i{width:3px;height:3px;border-radius:50%;background:var(--ink-3);opacity:.7;flex:none}
.lsw.sm button{height:26px;min-width:27px;padding:0 4px;font-size:10.5px}
.lsw-box{display:inline-flex;align-items:center;gap:6px;flex:none}
.thm-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink-2);background:var(--surface)}
.thm-btn:hover{color:var(--ink)}
.thm-btn[aria-expanded="true"]{background:var(--ink);color:var(--on-ink)}
.lsw-box.sm .thm-btn{width:32px;height:32px}
.cur-sw{height:34px;padding:0 22px 0 10px;border:0;border-radius:999px;background-color:var(--surface);color:var(--ink-2);font-size:11.5px;font-weight:700;letter-spacing:.06em;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 15px,calc(100% - 8px) 15px;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer;flex:none}
.cur-sw:hover{color:var(--ink)}
/* узкий экран: в шапках лендинга и мастера валюта показа прячется (она есть в кабинете), ссылка «Пакеты» — тоже */
@media (max-width:599px){.land-top .cur-sw,.wiz-head .cur-sw{display:none}}
@media (max-width:719px){.land-top [data-act="pk-scroll"]{display:none}}
@media (max-width:399px){.land-top,.wiz-head{gap:8px}.land-top .lsw-box,.wiz-head .lsw-box{gap:4px}}
.lsw-box.sm .cur-sw{height:32px;font-size:10.5px;padding:0 18px 0 8px;background-position:calc(100% - 10px) 14px,calc(100% - 6px) 14px}
.fx-conv{font-size:12.5px;opacity:.8;font-variant-numeric:tabular-nums}
.fx-cap{font-size:11.5px;color:var(--ink-3);margin:8px 0 0;font-variant-numeric:tabular-nums}
.thm-menu{position:fixed;z-index:200;min-width:196px;padding:6px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;animation:thmIn .14s ease}
.thm-menu button{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 12px;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink);text-align:left}
.thm-menu button:hover,.thm-menu button:focus-visible{background:var(--surface);outline:none}
.thm-menu button[aria-checked="true"]{color:var(--teal-ink)}
.thm-menu .ck{margin-left:auto}
@keyframes thmIn{from{opacity:0;transform:translateY(-4px)}}
.mtop .lsw-box{margin-left:auto}
.mtop .lsw-box+.co-btn{margin-left:0}
.lang-float{display:none}
@media (min-width:960px){.lang-float{display:block;position:absolute;top:16px;right:48px;z-index:6}}
.item>.lsw-box{margin-left:auto}
@media (max-width:480px){.land-top .logo-sub,.wiz-head .logo-sub{display:none}}

/* ---------- выпадающий список с поиском (страна, город, код телефона) ---------- */
.cb{position:relative;min-width:0}
.cb-btn{display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer;padding:0 12px 0 14px}
.cb-btn[aria-expanded="true"]{border-color:var(--teal-ink);box-shadow:0 0 0 3px var(--teal-2)}
.cb-btn>.ico{color:var(--ink-2)}
.cb-v{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden}
.cb-v .nm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-v .r{flex:none;color:var(--ink-2);font-size:13.5px;font-variant-numeric:tabular-nums;margin-left:auto;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-v .fl,.cb-opt .fl{font-size:19px;line-height:1;width:24px;text-align:center;flex:none;display:inline-grid;place-items:center}
.cb-ph{color:var(--ink-3);font-weight:500}
.cb-pop{position:absolute;left:0;top:calc(100% + 6px);z-index:70;width:max(100%,min(360px,calc(100vw - 36px)));background:var(--card);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow);padding:8px;animation:fade .12s ease}
.cb-search{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--surface);color:var(--ink-2)}
.cb-q{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:16px;font-weight:500;color:var(--ink)}
.cb-list{list-style:none;margin:6px 0 0;padding:0;max-height:min(300px,46vh);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.cb-opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:14.5px;line-height:1.3;position:relative}
.cb-opt:hover,.cb-opt.act{background:var(--teal-3)}
.cb-opt.sel{font-weight:700}
.cb-opt.sel::after{content:"";width:6px;height:11px;border:solid var(--teal-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);margin:0 4px 3px 2px;flex:none}
.cb-opt .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.cb-opt .sub{display:block;font-size:12px;color:var(--ink-2);font-weight:500;margin-top:1px}
.cb-opt .r{flex:none;color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums}
.cb-opt.sep,.cb-opt.extra{margin-top:7px}
.cb-opt.sep::before,.cb-opt.extra::before{content:"";position:absolute;left:10px;right:10px;top:-4px;height:1px;background:var(--line)}
.cb-opt.extra{color:var(--teal-ink);font-weight:600}
.cb-empty{padding:12px 10px;color:var(--ink-2);font-size:13.5px}
.phone-row{display:flex;gap:8px;min-width:0}
.phone-row>.cb{flex:0 0 auto;width:124px}
.phone-row>.input{flex:1;min-width:0}
.cb.dial .cb-pop{width:min(360px,calc(100vw - 36px))}
.geo-note{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.geo-note .ico{color:var(--teal-ink);margin-top:1px}
.geo-note:empty{display:none}

/* ---------- переводы акций и наград ---------- */
.ltabs{display:flex;gap:6px;flex-wrap:wrap}
.ltabs button{height:34px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.04em;background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.ltabs button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.ltabs .o{font-weight:600;font-size:11px;letter-spacing:0;opacity:.75}
.ltabs .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;opacity:.5;display:inline-block}
.ltabs .dot.on{background:var(--ok);border-color:var(--ok);opacity:1}
.pv-head{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap;width:100%;max-width:300px}
.pv-seg button{height:30px;font-size:12px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.pv-seg .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
.pv-note{margin:0;max-width:300px;text-align:center}

/* ---------- игра: касса, плюшки, уровень партнёра (docs/GAME_MODEL.md) ---------- */
.ico.fill{fill:currentColor}
.kactions{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:560px){.kactions{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kact{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;min-height:196px;padding:22px 20px 20px;border-radius:var(--r-xl);text-align:left;background:var(--ink);color:var(--on-ink)}
.kact .rings{width:260px;right:-110px;top:-120px}
.kact .rings i{border-color:rgba(150,213,210,.28)}
.kact .rings i:nth-child(3){border-color:var(--teal);opacity:.5}
.kact .big{width:62px;height:62px;border-radius:50%;background:var(--teal);color:#231F20;display:grid;place-items:center;box-shadow:0 0 0 10px rgba(150,213,210,.16);margin-bottom:auto}
.kact .big .ico{width:30px;height:30px;stroke-width:1.6}
.kact .st{font-weight:300;font-size:26px;line-height:1.12;letter-spacing:-.01em;margin-top:18px}
.kact .ss{font-size:13px;opacity:.78;line-height:1.45;max-width:36ch}
.kact.perk{background:var(--teal-3);color:var(--ink)}
.kact.perk .rings i{border-color:var(--teal-2)}
.kact.perk .big{background:var(--ink);color:var(--on-ink);box-shadow:0 0 0 10px var(--teal-2)}
.kact:hover{filter:brightness(1.03)}
.kact:active{transform:scale(.99)}
.medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;flex:none;color:#231F20;box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),0 2px 8px rgba(0,0,0,.14)}
.medal .ico{width:27px;height:27px;stroke-width:1.6}
.medal.sm{width:30px;height:30px}.medal.sm .ico{width:16px;height:16px}
.medal.lg{width:72px;height:72px}.medal.lg .ico{width:36px;height:36px}
.medal.bronze{background:linear-gradient(135deg,#EDB88A,#B8733C)}
.medal.silver{background:linear-gradient(135deg,#F4F7F8,#AAB6BA)}
.medal.gold{background:linear-gradient(135deg,#F8DF86,#CF9A1E)}
.medal.platinum{background:linear-gradient(135deg,#EAF7F6,#8CC6C3)}
.bar{height:10px;border-radius:10px;background:var(--teal-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--teal-ink);min-width:4px}
.bar.sm{height:6px}
.card.ink .bar{background:rgba(150,213,210,.22)}
.card.ink .bar i{background:var(--teal)}
.lvl-head{display:flex;align-items:center;gap:16px}
.lvl-title{font-weight:300;font-size:34px;line-height:1.05;letter-spacing:-.01em}
.lvl-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:16px}
.lvl-steps span{display:flex;flex-direction:column;gap:2px;padding:8px 8px 7px;border-radius:12px;font-size:11.5px;font-weight:600;background:rgba(150,213,210,.12);min-width:0}
.lvl-steps span b{font-weight:500;opacity:.7;font-variant-numeric:tabular-nums}
.lvl-steps span.on{background:var(--teal);color:#231F20}
.lvl-steps span.on b{opacity:.8}
.bene{width:100%;border-collapse:collapse;font-size:13.5px}
.bene th,.bene td{padding:10px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.bene thead th{border-top:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600;padding-top:0}
.bene tbody th{font-weight:500;color:var(--ink-2);width:40%}
.bene td{font-weight:600}
.bene td .hint{display:block;font-weight:500;margin-top:3px}
.quest{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-md);background:var(--surface)}
.quest .grow>.t{font-weight:600;font-size:14.5px;line-height:1.3}
.quest .d{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.45}
.quest .steps2{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.quest .steps2 div{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.quest .steps2 .ok{color:var(--ok-t);font-weight:600}
.quest.done{background:var(--ok-bg)}
.stars{display:inline-flex;gap:1px;color:#E0A100;vertical-align:-2px}
.stars .ico{stroke-width:1.5}
.rbig{font-weight:200;font-size:52px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rdist{display:grid;grid-template-columns:auto minmax(0,1fr) 2.6em;gap:6px 10px;align-items:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.rdist .bar{height:8px}
.rdist>span:nth-child(3n){text-align:right;color:var(--ink-2)}
.rcomment{padding:12px 0;border-top:1px solid var(--line)}
.rcomment:first-child{border-top:0;padding-top:4px}
.rcomment p{margin:6px 0 0;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.tagcnt{display:flex;flex-wrap:wrap;gap:6px}
.tagcnt span{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--surface);font-size:12.5px;font-weight:600}
.tagcnt span b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.tagcnt span.neg{background:var(--bad-bg);color:var(--bad-t)}
.demand{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.demand:first-of-type{border-top:0}
.demand .n{font-weight:200;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;min-width:1.6em;text-align:center}
.demand .grow{font-size:13.5px;line-height:1.45}
.demand .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 5px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;max-width:100%}
.bdg .e{width:22px;height:22px;border-radius:50%;background:var(--teal-2);display:grid;place-items:center;font-size:12px;line-height:1;flex:none}
.bdg .e .ico{width:13px;height:13px}
.bdg span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rule{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);background:var(--soon-bg);font-size:13.5px;line-height:1.55}
.rule .ico{color:var(--soon-t);margin-top:1px}
.rule a{color:inherit;font-weight:600}
.perk-card{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);min-width:0}
.perk-card .ct{font-weight:600;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.perk-card .cx{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.perk-card.legacy{border-color:var(--soon);box-shadow:0 0 0 1px var(--soon) inset}
.perk-card .banner{margin:0}
.perk-card .btn-row{margin-top:2px}
.perk-card .btn-row>.btn{flex:0 1 auto}
.perk-km{font-weight:600;color:var(--teal-ink);font-variant-numeric:tabular-nums}
.tpls{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 6px}
.tpls::-webkit-scrollbar{display:none}
@media (min-width:960px){.tpls{margin:0;padding:2px 0 6px;flex-wrap:wrap}}
.tpl{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:16px;border:1.5px dashed var(--line-2);width:210px;background:var(--card);text-decoration:none;color:inherit}
.tpl:hover{border-color:var(--teal-ink);background:var(--teal-3)}
.tpl[aria-pressed="true"]{border-style:solid;border-color:var(--ink)}
.tpl .t{font-weight:600;font-size:13.5px;line-height:1.3}
.tpl .s{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.kind-cards.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
.kind-cards.k4 .kind{padding:14px}
.corr{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:-2px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days .opt{min-width:48px;justify-content:center;padding:6px 10px}
.fsec{display:flex;flex-direction:column;gap:16px;padding:18px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card)}
.fsec>h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.vtags{display:flex;flex-wrap:wrap;gap:8px}
.vtags .opt{min-height:36px;font-size:13px;padding:4px 12px}
.gets{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);font-size:13.5px;line-height:1.4}
.gets b{font-variant-numeric:tabular-nums}
.success .pts.km{font-size:40px;font-weight:300}
.success .ok-ring.soon{background:var(--soon-bg);color:var(--soon-t)}
.success .sline{font-weight:600;max-width:36ch;line-height:1.45}
.pxp{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--teal-3);margin-top:16px}
.pxp .grow{display:flex;flex-direction:column;gap:6px}
.quota{display:flex;flex-direction:column;gap:8px}
.quota .row{font-size:13px}
.kpi .v .stars{margin-left:6px;vertical-align:1px}
.detail.rules,.detail.nw{grid-template-columns:minmax(0,1fr) auto}
.detail.nw dd{white-space:nowrap}
.detail.rules dt{color:var(--ink)}
.detail.rules dd{white-space:nowrap;color:var(--teal-ink)}
.ph-kind{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#1F6E69}
.ph-lvl{display:inline-flex;align-items:center;gap:4px}
.ph-medal{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.ph-medal.silver{background:#AAB6BA}.ph-medal.gold{background:#CF9A1E}.ph-medal.platinum{background:#8CC6C3}
</style>
</head>
<body>
<div id="root"></div>
<div id="sheets"></div>
<script>
'use strict';
(() => {
/* =====================================================================
   Helper для бизнеса — кабинет партнёра (одностраничное приложение)
   Контракты API: 04_AUTOMATION/docs/PARTNER_API.md, docs/I18N_GEO_API.md, docs/GAME_API.md
   Игровая модель (километры Helper, плюшки, уровни партнёра): docs/GAME_MODEL.md
   Языки ru / ro / en: словарь TX (ключ → [ru, ro, en]), tx() / tp() / tl(),
   числа, деньги, даты и множественное число — через Intl.
   ===================================================================== */

/* ================= base ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const MEM = {};
const store = {
  get(k) { try { const v = window.localStorage.getItem(k); return v == null ? (k in MEM ? MEM[k] : null) : v; } catch (e) { return k in MEM ? MEM[k] : null; } },
  set(k, v) { MEM[k] = String(v); try { window.localStorage.setItem(k, String(v)); } catch (e) {} },
  del(k) { delete MEM[k]; try { window.localStorage.removeItem(k); } catch (e) {} }
};
const jget = k => { const v = store.get(k); if (!v) return null; try { return JSON.parse(v); } catch (e) { return null; } };
const jset = (k, v) => { if (v == null) store.del(k); else store.set(k, JSON.stringify(v)); };
const K = {
  acct: 'helper.partner.acct.v1', pid: 'helper.partner.pid', api: 'helper.partner.api', cfg: 'helper.partner.cfg.v2' /* только подписанный config */,
  join: 'helper.partner.join', reg: 'helper.partner.reg.v1', lang: 'helper.partner.lang', dref: 'helper.partner.dref.v1' /* ?ref=HLP-XXXXXX — водитель, рекомендовавший компанию */,
  meta: l => 'helper.partner.meta.v2.' + l, gmeta: l => 'helper.partner.gmeta.v1.' + l, geoC: l => 'helper.partner.geo.countries.v1.' + l,
  loc: p => 'helper.partner.loc.' + p, todo: p => 'helper.partner.todo.' + p
};
const TG_BOT = 'https://t.me/HelperAutoMD_bot';
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
const CENTER = [47.0245, 28.8327]; /* Кишинёв, центр */
const CYR = /[Ѐ-ӿ]/;

/* ================= i18n ================= */
const LANGS = ['ru', 'ro', 'en'];
const LNAME = {ru: 'Русский', ro: 'Română', en: 'English'}; /* самоназвания языков */
const LOCALE = {ru: 'ru-RU', ro: 'ro-RO', en: 'en-GB'};
const LIX = {ru: 0, ro: 1, en: 2};
let LANG = 'en', LANG_SRC = 'default';
/* mo, ro-MD → ro */
const langOf = s => { const b = String(s || '').toLowerCase().replace('_', '-').split('-')[0]; return b === 'mo' || b === 'ro' ? 'ro' : b === 'ru' ? 'ru' : b === 'en' ? 'en' : ''; };
/* сохранённый выбор → язык браузера → en */
function langPick() {
  const s = store.get(K.lang);
  if (LANGS.indexOf(s) >= 0) return [s, 'saved'];
  const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
  for (let i = 0; i < list.length; i++) { const l = langOf(list[i]); if (l) return [l, 'browser']; }
  return ['en', 'default'];
}
const fill = (s, p) => p ? String(s).replace(/\{(\w+)\}/g, (m, k) => p[k] != null ? p[k] : m) : s;
function tl(l, k, p) {
  const e = TX[k];
  if (!e) return fill(k, p);
  let s = e[LIX[l]];
  if (s == null || s === '') s = e[2] != null ? e[2] : e[0];
  if (typeof s === 'object') s = s.other != null ? s.other : s.many;
  return fill(s, p);
}
const tx = (k, p) => tl(LANG, k, p);
const has = k => !!TX[k];
const PRC = {}, NFL = {};
const numL = (l, v) => (NFL[l] || (NFL[l] = new Intl.NumberFormat(LOCALE[l], {maximumFractionDigits: 2}))).format(v);
/* множественное число: Intl.PluralRules (ru: one/few/many/other, ro: one/few/other, en: one/other) */
function tp(k, n, p, l) {
  l = l || LANG;
  const e = TX[k]; if (!e) return k;
  let f = e[LIX[l]]; if (f == null) f = e[2];
  const v = +n || 0;
  const q = Object.assign({n: numL(l, v)}, p || {});
  if (typeof f === 'string') return fill(f, q);
  let cat = 'other';
  try { cat = (PRC[l] || (PRC[l] = new Intl.PluralRules(LOCALE[l]))).select(v); } catch (x) {}
  return fill(f[cat] != null ? f[cat] : f.other != null ? f.other : f.many, q);
}
/* тексты с сервера: ru — как есть; ro/en — локальный перевод по ключу, серверный текст — если он не кириллицей */
function srvT(server, local) {
  server = server == null ? '' : String(server);
  if (LANG === 'ru') return server && CYR.test(server) ? server : (local || server);
  return local || (server && !CYR.test(server) ? server : '') || server;
}
const srvMsg = (m, fb) => m && (LANG === 'ru' || !CYR.test(m)) ? m : fb;
/* ===================== Тема: Системная / Светлая / Тёмная (на этом устройстве, helper.theme.v1 — как в приложении водителя) =====================
   До первой отрисовки её применяет скрипт в <head>; цвета — токены CSS (:root, :root[data-theme="dark"], @media dark). */
const THEME_KEY = 'helper.theme.v1', THEMES = ['auto', 'light', 'dark'], THEME_BG = {light: '#FFFFFF', dark: '#0E1314'};
const THM_IC = {
  auto: '<svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>',
  light: '<svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
  dark: '<svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></svg>'
};
const THM_CK = '<svg class="ico sm ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
let themeMem = null, themeSig = '', thmOpen = null, THEME_STALE = false;
const themeGet = () => { const v = store.get(THEME_KEY) || themeMem; return THEMES.indexOf(v) >= 0 ? v : 'auto'; };
const themeDark = () => { const v = themeGet(); return v === 'dark' || (v === 'auto' && !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)); };
function themeApply() {
  const v = themeGet(), r = document.documentElement, sig = v + ':' + themeDark();
  if (v === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', v);
  if (sig === themeSig) return;
  themeSig = sig;
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { const md = m.getAttribute('media') || ''; m.setAttribute('content', v === 'auto' ? (/dark/.test(md) ? THEME_BG.dark : THEME_BG.light) : THEME_BG[v]); });
}
/* после смены темы: графики и карта берут цвета из токенов при отрисовке — перерисовать страницу (открыт лист — после его закрытия);
   кнопку Google рисует GIS — нарисовать заново */
function themeSet(v) {
  if (THEMES.indexOf(v) < 0) return;
  themeMem = v; store.set(THEME_KEY, v);
  themeApply();
  const gb = $('#g-box'); if (gb && !gb.hidden) gLogin(gb);
  if (sheetOpen() || CB_OPEN) { THEME_STALE = true; $$('.thm-btn').forEach(b => { b.outerHTML = thmBtn(); }); } else render();
}
function thmBtn() {
  const v = themeGet(), lb = tx('thm.label') + ': ' + tx('thm.' + v);
  return '<button type="button" class="thm-btn" data-act="thm-menu" aria-haspopup="menu" aria-expanded="false" aria-label="' + esc(lb) + '" title="' + esc(lb) + '">' + THM_IC[v] + '</button>';
}
function thmMenu(btn) {
  if (thmOpen) { const same = thmOpen.btn === btn; thmClose(); if (same) return; }
  const cur = themeGet(), m = document.createElement('div');
  m.className = 'thm-menu'; m.setAttribute('role', 'menu'); m.setAttribute('aria-label', tx('thm.label'));
  m.innerHTML = THEMES.map(v => '<button type="button" role="menuitemradio" tabindex="-1" aria-checked="' + (v === cur) + '" data-act="thm-set" data-v="' + v + '">' + THM_IC[v] + '<span>' + esc(tx('thm.' + v)) + '</span>' + (v === cur ? THM_CK : '') + '</button>').join('');
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.top = (r.bottom + 6 + h <= window.innerHeight - 8 ? r.bottom + 6 : Math.max(8, r.top - 6 - h)) + 'px';
  m.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.right - w)) + 'px';
  btn.setAttribute('aria-expanded', 'true');
  const items = Array.from(m.querySelectorAll('[role="menuitemradio"]')), at = i => { try { items[(i + items.length) % items.length].focus({preventScroll: true}); } catch (e) {} };
  m.addEventListener('keydown', e => {
    const i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); at(i + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); at(i - 1); }
    else if (e.key === 'Home') { e.preventDefault(); at(0); }
    else if (e.key === 'End') { e.preventDefault(); at(items.length - 1); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); thmClose(true); }
    else if (e.key === 'Tab') thmClose();
  });
  const out = e => { if (!m.contains(e.target) && !btn.contains(e.target)) thmClose(); }, off = () => thmClose();
  document.addEventListener('pointerdown', out, true); window.addEventListener('resize', off); window.addEventListener('scroll', off, true);
  thmOpen = {m, btn, undo: () => { document.removeEventListener('pointerdown', out, true); window.removeEventListener('resize', off); window.removeEventListener('scroll', off, true); }};
  at(Math.max(0, THEMES.indexOf(cur)));
}
function thmClose(refocus) {
  if (!thmOpen) return;
  const o = thmOpen; thmOpen = null; o.undo(); o.m.remove();
  if (document.contains(o.btn)) { o.btn.setAttribute('aria-expanded', 'false'); if (refocus) try { o.btn.focus({preventScroll: true}); } catch (e) {} }
}

  'land.lead': ['Helper — приложение для водителей: сервисная книжка, напоминания о ТО и игра «километры Helper». Подключите автосервис, мойку, шиномонтаж, АЗС или страховую: водители получают километры Helper за визиты к вам и тратят их на ваши бесплатные плюшки. Вы не платите за километры, растёте в рейтинге партнёров, запускаете акции для водителей рядом и видите статистику.', 'Helper este aplicația pentru șoferi: carnet de service, mementouri pentru revizie și jocul «kilometri Helper». Conectați service-ul auto, spălătoria, vulcanizarea, benzinăria sau compania de asigurări: șoferii primesc kilometri Helper pentru vizitele la dumneavoastră și îi folosesc pe beneficiile dvs. gratuite. Nu plătiți pentru kilometri, urcați în clasamentul partenerilor, lansați campanii pentru șoferii din apropiere și urmăriți statisticile.', 'Helper is an app for drivers: a service log, maintenance reminders and the “Helper kilometres” game. Connect your car service, car wash, tyre shop, fuel station or insurance company: drivers earn Helper kilometres for visiting you and spend them on your free perks. You don’t pay for kilometres — you climb the partner ranking, run campaigns for drivers nearby and see your statistics.'],

async function enterCabinet(alive) {
  const join = store.get(K.join);

      const d = await api('/v1/partner/join', {body: {code: join}});
      st.pid = +d.partner_id; store.set(K.pid, d.partner_id);

    } catch (e) { if (e.status === 401) return false; toast(e.message, 6000); }
  }
  let mine;
  try { mine = await api('/v1/partner/mine'); }
  catch (e) {
    if (!alive()) return false;

    return false;

  st.mine = mine.items || [];
  if (!st.mine.length) { pageNoCompany(); return false; }
  let pid = st.pid && st.mine.some(x => +x.partner_id === +st.pid) ? +st.pid : null;
  if (!pid && st.mine.length === 1) pid = +st.mine[0].partner_id;
  if (!pid) { pagePick(); return false; }

/* ================= вход через Google (Google Identity Services) =================
   Кнопка в листе входа — только если сервер вернул google_client_id в /v1/status; скрипт GIS грузится лениво.
   ID token → POST /v1/auth/google → те же токены, что у входа по паролю. Новому человеку в закрытом режиме сервер
   ответит invite_* — компании регистрируются через «Зарегистрировать компанию» (там приглашение не нужно). */
const GIS_SRC = 'https://accounts.google.com/gsi/client';
let gisP = null, gisInit = '', gStP = null;
function gCid() {
  if (!gStP) gStP = srvStatus().then(d => (d && typeof d.google_client_id === 'string' && d.google_client_id.trim()) || '');
  return gStP;
}
function gisLoad() {
  const ok = () => window.google && google.accounts && google.accounts.id;
  if (ok()) return Promise.resolve(google.accounts.id);
  if (!gisP) gisP = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = GIS_SRC; s.async = true; s.defer = true;
    s.onload = () => ok() ? res(google.accounts.id) : rej(new Error('gis'));
    s.onerror = () => { gisP = null; s.remove(); rej(new Error('gis')); };
    document.head.appendChild(s);
  });
  return gisP;
}
async function gLogin(box) {
  if (!box) return;
  const cid = await gCid();
  if (!cid || !box.isConnected) return;
  let id;
  try { id = await gisLoad(); } catch (e) { return; }
  if (!box.isConnected) return;
  box.innerHTML = '<div class="gslot"></div><div class="or-div" aria-hidden="true"><span>' + tx('li.or') + '</span></div>';
  box.hidden = false;
  if (gisInit !== cid) { id.initialize({client_id: cid, callback: gCallback, auto_select: false, cancel_on_tap_outside: true, context: 'signin', ux_mode: 'popup', itp_support: true}); gisInit = cid; }
  const slot = box.querySelector('.gslot'), a = document.documentElement.getAttribute('data-theme');
  const dark = a ? a === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  try { id.renderButton(slot, {type: 'standard', theme: dark ? 'filled_black' : 'outline', size: 'large', shape: 'pill', text: 'signin_with', logo_alignment: 'center', width: Math.max(200, Math.min(400, Math.round(slot.getBoundingClientRect().width) || 320)), locale: LANG}); } catch (e) {}
}
async function gCallback(r) {
  if (!r || !r.credential) return;
  const slot = $('#g-box .gslot');
  if (slot) slot.classList.add('busy');
  showErr('li-err', '');
  toast(tx('g.busy'));
  let d;
  try { d = await api('/v1/auth/google', {body: {credential: r.credential, device: tx('device'), language: LANG}, auth: false}); }
  catch (e) {
    if (slot && slot.isConnected) slot.classList.remove('busy');
    if (e.code === 'google_disabled') { gStP = Promise.resolve(''); const b = $('#g-box'); if (b) b.hidden = true; return showErr('li-err', tx('g.disabled')); }
    if (/^invite_/.test(e.code || '')) return showErr('li-err', tx('g.noacct'));
    return showErr('li-err', e.code === 'google_bad_token' ? tx('g.bad') : e.code === 'google_email_unverified' ? tx('g.unverified') : e.message);
  }
  if (!setTokens(d)) return showErr('li-err', tx('e.no_tokens'));
  loginDone();
}

function clearHash(to) { try { history.replaceState(null, '', location.pathname + location.search + (to || '')); } catch (e) {} }
function specialHash() {
  const h = location.hash;
  let m = /^#magic=([^&]+)/.exec(h);
  if (m) { clearHash('#/'); magicLogin(decodeURIComponent(m[1])); return true; }
  m = /^#topup=(success|cancel)/.exec(h);
  if (m) { clearHash('#/billing?topup=' + m[1]); render(); return true; }
  m = /^#join=([^&]+)/.exec(h);
  if (m) {
    store.set(K.join, decodeURIComponent(m[1]).trim());
    if (logged()) { clearHash('#/'); st.partner = null; $('#root').dataset.shell = ''; render(); }
    else { clearHash('#/join'); render(); }
    return true;
  }
  return false;
}

/* ================= scanner: camera (BarcodeDetector → ZXing), photo, torch ================= */
const SC = {active: false, stream: null, track: null, timer: 0, engine: null, cv: null, torch: false};
async function scanEngine() {
  if (SC.engine) return SC.engine;
  if ('BarcodeDetector' in window) {
    try {
      const sup = await window.BarcodeDetector.getSupportedFormats();
      const f = ['qr_code', 'code_128', 'ean_13', 'ean_8'].filter(x => sup.indexOf(x) >= 0);
      if (f.indexOf('qr_code') >= 0) { SC.engine = {kind: 'native', det: new window.BarcodeDetector({formats: f})}; return SC.engine; }
    } catch (e) {}
  }
  SC.engine = await zxEngine();
  return SC.engine;
}
async function zxEngine() {
  if (SC.zx) return SC.zx;
  const Z = await lib('zxing');
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.QR_CODE, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  SC.zx = {kind: 'zxing', Z, reader};
  return SC.zx;
}
function zxDecodeCanvas(eng, cv) {
  const Z = eng.Z;
  try { const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv))); return eng.reader.decodeWithState(bmp).getText(); }
  catch (e) { return null; }
  finally { try { eng.reader.reset(); } catch (e) {} }
}
function drawTo(src, w, h, max) {
  const cv = SC.cv || (SC.cv = document.createElement('canvas'));
  const k = Math.min(1, max / Math.max(w, h));
  cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
  const ctx = cv.getContext('2d', {willReadFrequently: true});
  ctx.imageSmoothingEnabled = true;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(src, 0, 0, cv.width, cv.height);
  return cv;
}
async function decodeFrame(eng, v) {
  if (eng.kind === 'native') { const r = await eng.det.detect(v); return r && r.length ? r[0].rawValue : null; }
  return zxDecodeCanvas(eng, drawTo(v, v.videoWidth, v.videoHeight, 900));
}
async function decodeImageFile(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('img')); i.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight;
    const eng = await scanEngine().catch(() => null);
    if (eng && eng.kind === 'native') {
      try { const r = await eng.det.detect(drawTo(img, w, h, 2000)); if (r && r.length) return r[0].rawValue; } catch (e) {}
    }
    const zx = await zxEngine();
    for (const max of [1600, 1000, 640, 2400]) { const s = zxDecodeCanvas(zx, drawTo(img, w, h, max)); if (s) return s; }
    return null;
  } finally { URL.revokeObjectURL(url); }
}
function camErr(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') return tx('cam.denied');
  if (n === 'NotFoundError' || n === 'OverconstrainedError' || n === 'DevicesNotFoundError') return tx('cam.none');
  if (n === 'NotReadableError' || n === 'TrackStartError') return tx('cam.busy');
  return tx('cam.fail');
}
function scanMsg(s) { const ov = $('#scan'); if (!ov) return; let m = ov.querySelector('.scan-msg'); if (!m) { m = document.createElement('div'); m.className = 'scan-msg'; m.setAttribute('role', 'alert'); ov.appendChild(m); } m.textContent = s; }
function scanKey(e) { if (e.key === 'Escape') scanClose(); }
async function scanOpen() {
  if (SC.active) return;
  closeSheet(true);
  SC.active = true; SC.torch = false;
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {}
  const ov = document.createElement('div');
  ov.className = 'scan'; ov.id = 'scan'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', tx('scan.aria'));
  ov.innerHTML = '<video playsinline muted autoplay></video><div class="scan-shade"><div class="scan-frame"><i></i><i></i><i></i><i></i><span class="scan-line"></span></div></div>' +
    '<div class="scan-top"><button class="rbtn" data-act="scan-close" aria-label="' + esc(tx('scan.close')) + '">' + ic('close') + '</button><span class="t">' + tx(KS.mode === 'perk' ? 'scan.t.perk' : 'scan.t.visit') + '</span><button class="rbtn" data-act="scan-torch" aria-label="' + esc(tx('scan.torch')) + '" aria-pressed="false" hidden>' + ic('torch') + '</button><span class="rbtn" style="visibility:hidden" id="scan-sp"></span></div>' +
    '<p class="scan-hint">' + tx('scan.hint') + '</p>' +
    '<div class="scan-bot"><label class="btn file-btn">' + ic('image', 'sm') + tx('kassa.photo') + '<input type="file" accept="image/*" data-ch="scan-file" aria-label="' + esc(tx('kassa.photo.aria')) + '"></label><button class="btn" data-act="manual">' + ic('keyboard', 'sm') + tx('kassa.manual') + '</button></div>';
  document.body.appendChild(ov); document.body.classList.add('lock');
  document.addEventListener('keydown', scanKey);
  if (!window.isSecureContext) return scanMsg(tx('scan.https'));
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return scanMsg(tx('scan.nobrowser'));
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}}); }
  catch (e) { return scanMsg(camErr(e)); }
  if (!SC.active) { stream.getTracks().forEach(tr => tr.stop()); return; }
  SC.stream = stream; SC.track = stream.getVideoTracks()[0];
  const v = ov.querySelector('video');
  v.srcObject = stream;
  try { await v.play(); } catch (e) {}
  try { const caps = SC.track.getCapabilities ? SC.track.getCapabilities() : {}; if (caps && caps.torch) { ov.querySelector('[data-act="scan-torch"]').hidden = false; $('#scan-sp').remove(); } } catch (e) {}
  let eng;
  try { eng = await scanEngine(); } catch (e) { return scanMsg(e.message); }
  const tick = async () => {
    if (!SC.active) return;
    if (v.readyState >= 2 && v.videoWidth) {
      let txt = null;
      try { txt = await decodeFrame(eng, v); } catch (e) {}
      if (txt && SC.active) { feedback(); scanClose(); handleCode(txt); return; }
    }
    if (SC.active) SC.timer = setTimeout(tick, eng.kind === 'native' ? 120 : 200);
  };
  tick();
}
function scanClose() {
  SC.active = false; clearTimeout(SC.timer);
  if (SC.stream) { try { SC.stream.getTracks().forEach(tr => tr.stop()); } catch (e) {} }
  SC.stream = SC.track = null;
  const ov = $('#scan'); if (ov) ov.remove();
