<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http://127.0.0.1:* http://localhost:*; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://accounts.google.com/gsi/">
<meta name="referrer" content="strict-origin-when-cross-origin">

<meta name="theme-color" content="#0E1314" media="(prefers-color-scheme: dark)">
<script>/* тема до первой отрисовки (без вспышки): helper.theme.v1 = auto | light | dark — общий выбор устройства с приложением водителя */
(function(){try{var t=localStorage.getItem('helper.theme.v1');if(t!=='light'&&t!=='dark')return;document.documentElement.setAttribute('data-theme',t);var c=t==='dark'?'#0E1314':'#FFFFFF',ms=document.querySelectorAll('meta[name="theme-color"]');for(var i=0;i<ms.length;i++)ms[i].setAttribute('content',c)}catch(e){}})();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --teal:#96D5D2; --teal-2:#C9E9E6; --teal-3:#EEF7F6; --teal-ink:#1F6E69;
  --ink:#231F20; --ink-2:#56605F; --ink-3:#86908F;
  --bg:#FFFFFF; --bg-outer:#E9F1F0; --surface:#F3F7F7; --card:#FFFFFF; --line:#E2EAE9; --line-2:#CFDBDA;
  --bar-bg:rgba(255,255,255,.9);
  --on-teal:#231F20; --on-ink:#FFFFFF;
  --ok:#2E9A5E; --ok-bg:#E4F4EA; --ok-t:#1D7444;
  --soon:#D18F14; --soon-bg:#FBF0D9; --soon-t:#8A5A00;
  --bad:#D2433A; --bad-bg:#FBE5E3; --bad-t:#B0302A;
  --c1:#159a92; --c2:#e0703c; --c3:#5a4fc9; --c4:#d4588f;
  --shadow:0 1px 2px rgba(35,31,32,.05),0 10px 30px rgba(35,31,32,.07);
  --shadow-up:0 -8px 30px rgba(35,31,32,.10);
  --font:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-xl:26px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --tabbar-h:64px; --side-w:264px;
  --logo-light:block; --logo-dark:none; --tile-filter:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --teal:#96D5D2; --teal-2:#24413F; --teal-3:#142726; --teal-ink:#9ADAD6;
    --ink:#EEF3F2; --ink-2:#AAB7B6; --ink-3:#7A8A89;
    --bg:#0E1314; --bg-outer:#070A0B; --surface:#161F20; --card:#172122; --line:#243234; --line-2:#30413F;
    --bar-bg:rgba(14,19,20,.9);
    --on-teal:#0E1314; --on-ink:#0E1314;
    --ok:#4CC27F; --ok-bg:#15301F; --ok-t:#79DBA1;
    --soon:#E7A93A; --soon-bg:#33270F; --soon-t:#F2C063;
    --bad:#EF6A60; --bad-bg:#3A1A18; --bad-t:#FF9A90;
    --c1:#1aa39a; --c2:#d9683a; --c3:#6f64e0; --c4:#d65590;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    --shadow-up:0 -8px 30px rgba(0,0,0,.45);
    --logo-light:none; --logo-dark:block;
    --tile-filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --teal:#96D5D2; --teal-2:#24413F; --teal-3:#142726; --teal-ink:#9ADAD6;
  --ink:#EEF3F2; --ink-2:#AAB7B6; --ink-3:#7A8A89;
  --bg:#0E1314; --bg-outer:#070A0B; --surface:#161F20; --card:#172122; --line:#243234; --line-2:#30413F;
  --bar-bg:rgba(14,19,20,.9);
  --on-teal:#0E1314; --on-ink:#0E1314;
  --ok:#4CC27F; --ok-bg:#15301F; --ok-t:#79DBA1;
  --soon:#E7A93A; --soon-bg:#33270F; --soon-t:#F2C063;
  --bad:#EF6A60; --bad-bg:#3A1A18; --bad-t:#FF9A90;
  --c1:#1aa39a; --c2:#d9683a; --c3:#6f64e0; --c4:#d65590;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-up:0 -8px 30px rgba(0,0,0,.45);
  --logo-light:none; --logo-dark:block;
  --tile-filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:clip}
body.lock{overflow:hidden}
#root{overflow-x:clip;min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--teal-ink)}
svg{display:block}
h1,h2,h3{text-wrap:balance}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:18px;height:18px}
.ico.xs{width:15px;height:15px;stroke-width:1.9}
.ico.lg{width:30px;height:30px;stroke-width:1.5}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--teal-ink);outline-offset:2px;border-radius:8px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.logo{height:30px;width:auto}
.logo.l{display:var(--logo-light)} .logo.d{display:var(--logo-dark)}
.logo-wrap{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo-sub{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);border-left:1px solid var(--line-2);padding-left:10px;line-height:1.2}
.muted{color:var(--ink-2)} .muted-3{color:var(--ink-3)}
.small{font-size:13px}.xsmall{font-size:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0}
.section{margin-top:28px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-head h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.section-head .link{font-size:13px;font-weight:600;color:var(--teal-ink);display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.break{overflow-wrap:anywhere}

/* ---------- rings motif ---------- */
.rings{position:absolute;pointer-events:none;z-index:-1;aspect-ratio:1}
.rings i{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--teal-2)}
.rings i:nth-child(2){inset:14%;border-color:var(--teal-2)}
.rings i:nth-child(3){inset:28%;border-color:var(--teal);opacity:.55}

/* ---------- shell ---------- */
.shell{min-height:100vh;min-height:100dvh}
.side{display:none}
.main{position:relative;isolation:isolate;max-width:760px;margin:0 auto;padding:0 18px calc(var(--tabbar-h) + 34px + env(safe-area-inset-bottom,0px));overflow-x:clip;min-height:60vh}
.main.notab{padding-bottom:48px}
.mtop{position:sticky;top:0;z-index:30;margin:0 -18px;padding:calc(8px + env(safe-area-inset-top,0px)) 18px 8px;background:var(--bar-bg);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);display:flex;align-items:center;gap:10px;min-height:58px}
.mtop .logo{height:24px}
.co-btn{display:flex;align-items:center;gap:8px;max-width:62%;min-width:0;height:38px;padding:0 6px 0 12px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:600;margin-left:auto}
.co-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.co-btn .av{width:28px;height:28px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--bar-bg);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line);padding:6px 6px env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 7px;color:var(--ink-3);font-size:10.5px;font-weight:600;letter-spacing:.01em;border-radius:14px;text-decoration:none;min-width:0}
.tab .pill{width:52px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .pill{background:var(--teal-2)}
@media (min-width:960px){
  .shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr)}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;border-right:1px solid var(--line);padding:24px 16px 18px;gap:2px;background:var(--bg);z-index:20}
  .main{max-width:1180px;width:100%;padding:34px 48px 72px}
  .main.notab{padding-bottom:72px}
  .mtop,.tabbar{display:none}
}
.side .logo-wrap{padding:0 10px 18px}
.side-co{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:14px;background:var(--surface);margin-bottom:14px}
.side-co .av{width:36px;height:36px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.side-co .t{font-weight:600;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-co .s{font-size:11.5px;color:var(--ink-2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;color:var(--ink-2);font-weight:600;font-size:14.5px;text-decoration:none}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--teal-2);color:var(--ink)}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.side-foot .who{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* page head */
.phead{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:14px 18px;flex-wrap:wrap;margin:16px 0 22px}
.phead .ttl{min-width:0;flex:1 1 260px}
.phead h1{font-weight:300;font-size:31px;line-height:1.1;letter-spacing:-.01em;margin:6px 0 0}
.phead .sub{color:var(--ink-2);font-size:13.5px;margin:6px 0 0;max-width:62ch}
.phead .acts{display:flex;gap:10px;flex-wrap:wrap}
.phead .rings{width:220px;right:-90px;top:-110px}
@media (min-width:960px){.phead{margin:6px 0 30px}.phead h1{font-size:44px;font-weight:200;letter-spacing:-.015em}.phead .rings{width:300px;right:-60px;top:-150px}}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:none;margin-top:4px}
.back:hover{color:var(--ink)}

/* ---------- buttons ---------- */
.btn{height:50px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;background:var(--teal);color:var(--on-teal);transition:transform .12s,filter .12s;white-space:nowrap;text-decoration:none;max-width:100%}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.soft{background:var(--surface);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line-2);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad-t)}
.btn.sm{height:38px;padding:0 16px;font-size:13.5px}
.btn.xl{height:60px;font-size:16px;padding:0 28px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .spin{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 140px}
.textbtn{color:var(--teal-ink);font-weight:600;font-size:14px;padding:8px 2px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.gwrap{display:flex;flex-direction:column;gap:12px;margin:6px 0 10px}
.gslot{display:flex;justify-content:center;min-height:44px}
.gslot.busy{opacity:.5;pointer-events:none}
.or-div{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12.5px;font-weight:500}
.or-div::before,.or-div::after{content:'';flex:1;height:1px;background:var(--line)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--surface);flex:none}
.iconbtn:hover{background:var(--teal-3)}
.iconbtn.ghost{background:transparent}
.iconbtn.danger{color:var(--bad-t)}

/* ---------- chips / status ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}
.chips::-webkit-scrollbar{display:none}
@media (min-width:960px){.chips{margin:0;padding:2px 0 4px;flex-wrap:wrap}}
.chip{height:34px;padding:0 14px;border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none;border:1px solid transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.chip .x{opacity:.6;margin-left:2px}
.status{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-ok{background:var(--ok-bg);color:var(--ok-t)}
.st-soon{background:var(--soon-bg);color:var(--soon-t)}
.st-bad{background:var(--bad-bg);color:var(--bad-t)}
.st-none{background:var(--surface);color:var(--ink-3)}
.st-teal{background:var(--teal-2);color:var(--ink)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--teal-2);color:var(--ink);white-space:nowrap}
.badge.dark{background:var(--ink);color:var(--on-ink)}
.badge.soft{background:var(--surface);color:var(--ink-2)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:999px;padding:4px;gap:4px}
.seg button{height:36px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2);padding:0 10px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.inline{display:inline-grid}
.seg button .ico{display:inline-block;vertical-align:-4px;margin-right:6px}
/* вход по телефону */
.ph-row{display:flex;gap:8px}
.ph-row select.input{flex:0 0 auto;width:auto;min-width:112px;padding-right:34px}
.ph-cc1{flex:none;height:48px;padding:0 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;font-weight:600}
#pp-num{flex:1;min-width:0;font-variant-numeric:tabular-nums}
#pp-code{font-size:24px;letter-spacing:.42em;text-align:center;font-variant-numeric:tabular-nums;padding-left:calc(14px + .42em)}
.ph-sent{margin:0 0 12px;padding:12px 14px;border-radius:var(--r-md);background:var(--teal-3);font-size:14px;line-height:1.45}
.ph-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.ph-links .textbtn{display:inline-flex;align-items:center;gap:6px}
.ph-links .textbtn:disabled{color:var(--ink-3);cursor:default}

/* ---------- cards / lists ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;position:relative}
.card.tint{background:var(--teal-3);border-color:transparent}
.card.shadow{box-shadow:var(--shadow);border-color:transparent}
.card.ink{background:var(--ink);color:var(--on-ink);border-color:transparent;overflow:hidden;isolation:isolate}
.card.ink .muted{color:inherit;opacity:.72}
.card.pad-lg{padding:22px}
.card h3{margin:0;font-size:16px;font-weight:600}
.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;position:relative;min-height:62px;text-decoration:none;color:inherit}
.item+.item::before{content:"";position:absolute;top:0;left:64px;right:0;height:1px;background:var(--line)}
a.item:hover,button.item:hover{background:var(--surface)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.item .end{text-align:right;flex:none;font-variant-numeric:tabular-nums;font-size:13px}
.item .end b{display:block;font-size:14.5px}
.item .chev{color:var(--ink-3)}
.ic-circle{width:40px;height:40px;border-radius:50%;background:var(--teal-3);color:var(--ink);display:grid;place-items:center;flex:none}
.ic-circle.ok{background:var(--ok-bg);color:var(--ok-t)}
.ic-circle.soon{background:var(--soon-bg);color:var(--soon-t)}
.ic-circle.bad{background:var(--bad-bg);color:var(--bad-t)}
.ic-circle.ink{background:var(--ink);color:var(--on-ink)}
.ic-circle.teal{background:var(--teal);color:var(--on-teal)}
.empty{text-align:center;padding:36px 20px;color:var(--ink-2)}
.empty .ring{width:68px;height:68px;border-radius:50%;border:2px solid var(--teal-2);display:grid;place-items:center;margin:0 auto 14px;color:var(--teal-ink);box-shadow:0 0 0 8px var(--teal-3)}
.empty .t{font-weight:600;color:var(--ink);font-size:15px}
.empty p{margin:6px auto 16px;max-width:40ch;font-size:13.5px}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.grid-3{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:720px){.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
@media (min-width:1100px){.cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px;align-items:start}.cols .sticky{position:sticky;top:24px}}
.detail{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:14px;margin:0}
.detail dt{color:var(--ink-2)}
.detail dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.copyline{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:10px 10px 10px 16px;min-width:0}
.copyline .v{flex:1;min-width:0;font-weight:600;font-size:14px;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);background:var(--soon-bg);color:var(--ink);margin:14px 0 4px}
.banner.bad{background:var(--bad-bg)}
.banner.ok{background:var(--ok-bg)}
.banner.teal{background:var(--teal-3)}
.banner .ic{color:var(--soon-t);margin-top:1px}
.banner.bad .ic{color:var(--bad-t)} .banner.ok .ic{color:var(--ok-t)} .banner.teal .ic{color:var(--teal-ink)}
.banner .t{font-weight:600;font-size:14px}
.banner .s{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.banner .s ul{margin:6px 0 0;padding-left:18px}
.banner .a{margin-top:10px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}}
.kpi{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;min-width:0}
.kpi .k{font-size:12px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-weight:300;font-size:clamp(22px,6.2vw,27px);letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small{font-size:12px;font-weight:500;color:var(--ink-2);margin-left:3px;letter-spacing:0}
.kpi .d{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.kpi.teal{background:var(--teal-3)}
.kanon{border-bottom:1.5px dotted var(--ink-3);cursor:help;font-size:.72em;font-weight:500;letter-spacing:0}
.bignum{font-weight:200;font-size:52px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bignum small{font-size:16px;font-weight:500;opacity:.7;margin-left:6px;letter-spacing:0}

/* ---------- forms ---------- */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.flabel{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;gap:10px}
.field .cnt{font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.field .cnt.over{color:var(--bad-t)}
.input,select.input,textarea.input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;font-weight:500;color:var(--ink);appearance:none;-webkit-appearance:none;min-width:0}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea.input{height:auto;min-height:96px;padding:12px 14px;line-height:1.45;resize:vertical}
.input:focus{outline:none;border-color:var(--teal-ink);box-shadow:0 0 0 3px var(--teal-2)}
.input[aria-invalid="true"]{border-color:var(--bad)}
.input.big{height:68px;font-size:34px;font-weight:300;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.input-unit{position:relative}
.input-unit .u{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-weight:600;font-size:14px;pointer-events:none}
.input-unit .input{padding-right:64px}
/* цена плюшки: − [ 25 км ] + */
.pts-step{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pts-step .input-unit{flex:1;max-width:220px}
.pts-step .input{text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;padding-left:64px}
.pts-step input[type=number]{-moz-appearance:textfield;appearance:textfield}
.pts-step input[type=number]::-webkit-inner-spin-button,.pts-step input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pts-step .iconbtn{width:48px;height:48px;border:1px solid var(--line)}
.pts-step .iconbtn:disabled{opacity:.4;cursor:default}
.input[aria-invalid="true"]{border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2.stack-sm{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--ink-3);line-height:1.45}
.err{font-size:13px;color:var(--bad-t);font-weight:600;background:var(--bad-bg);padding:10px 12px;border-radius:10px}
.opt-grid{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:40px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line-2);font-size:13.5px;font-weight:600;color:var(--ink-2);background:transparent;display:inline-flex;align-items:center;gap:6px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.opt:disabled{opacity:.45}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:6px 0;cursor:pointer}
.switch .lbl{font-weight:600;font-size:14.5px;display:block}
.switch .lbl+span{font-size:12.5px;color:var(--ink-2)}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:30px;background:var(--line-2);position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:14px;line-height:1.45}
.check input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line-2);flex:none;margin:0;display:grid;place-items:center;cursor:pointer;background:var(--bg)}
.check input:checked{background:var(--ink);border-color:var(--ink)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--on-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
input[type=range]{width:100%;accent-color:var(--teal-ink);height:28px}
.range-row{display:flex;align-items:center;gap:14px}
.range-row .v{min-width:74px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.kind-cards{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.kind-cards{grid-template-columns:repeat(3,1fr)}}
.kind{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px;border-radius:18px;border:1.5px solid var(--line-2);text-align:left;background:var(--card);overflow:hidden;isolation:isolate}
.kind .kt{font-weight:600;font-size:15px}
.kind .kd{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.kind[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.kind[aria-pressed="true"] .ic-circle{background:var(--teal)}
.steps{display:flex;gap:6px;margin:4px 0 20px}
.steps i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--ink)}
.stepnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.stepnav button{height:32px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface);display:inline-flex;align-items:center;gap:6px}
.stepnav button[aria-current="step"]{background:var(--ink);color:var(--on-ink)}
.stepnav button .n{font-variant-numeric:tabular-nums;opacity:.7}
.wiz-foot{display:flex;gap:10px;margin-top:24px}
.wiz-foot .btn{flex:1}
.wiz-foot .btn.back-btn{flex:0 0 auto}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(10,14,15,.45);animation:fade .2s ease}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 16px);background:var(--bg);border-radius:26px 26px 0 0;box-shadow:var(--shadow-up);display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sheet.full{height:calc(100% - env(safe-area-inset-top,0px) - 10px)}
.sheet-grab{width:40px;height:5px;border-radius:5px;background:var(--line-2);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 18px 6px;flex:none}
.sheet-head h2{flex:1;margin:0;font-size:19px;font-weight:600;line-height:1.25;min-width:0}
.sheet-body{overflow-y:auto;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1;min-height:0}
@media (min-width:720px){
  .sheet-wrap{align-items:center;padding:24px}
  .sheet{border-radius:26px;max-height:calc(100vh - 48px)}
  .sheet.full{height:auto;max-height:calc(100vh - 48px)}
  .sheet.wide{max-width:760px}
  .sheet-grab{display:none}
  .sheet-head{padding:18px 22px 6px}
  .sheet-body{padding:8px 22px 24px}
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--on-ink);padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 36px);width:max-content;text-align:center;animation:up .2s ease}
@media (min-width:960px){.toast{bottom:32px;left:calc(50% + var(--side-w) / 2)}}
.pop{position:fixed;z-index:96;max-width:280px;background:var(--ink);color:var(--on-ink);font-size:12.5px;line-height:1.45;padding:10px 12px;border-radius:12px;box-shadow:var(--shadow);animation:fade .15s ease}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--surface) 0,var(--teal-3) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.3s ease infinite;border-radius:14px}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}

/* ---------- landing ---------- */
.land{position:relative;isolation:isolate;overflow-x:clip;min-height:100vh}
.land-top{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 10px}
.land-top .logo{height:28px}
.land-top .grow{flex:1}
.hero{max-width:1180px;margin:0 auto;padding:26px 18px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:34px;align-items:center;position:relative}
.hero h1{font-weight:200;font-size:40px;line-height:1.05;letter-spacing:-.02em;margin:12px 0 14px}
.hero h1 b{font-weight:500}
.hero .lead{font-size:16px;line-height:1.6;color:var(--ink-2);max-width:52ch;margin:0}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.hero .cta .btn{flex:1 1 220px}
.hero-art{position:relative;display:grid;place-items:center;min-height:430px}
.hero-art .rings{width:min(560px,130vw);left:50%;top:50%;transform:translate(-50%,-50%)}
@media (min-width:960px){
  .land-top{padding:26px 48px 10px}
  .hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);padding:54px 48px 30px;gap:40px}
  .hero h1{font-size:64px}
  .hero .cta .btn{flex:0 0 auto}
}
.benefits{max-width:1180px;margin:0 auto;padding:30px 18px;display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:720px){.benefits{grid-template-columns:1fr 1fr}}
@media (min-width:960px){.benefits{grid-template-columns:repeat(4,1fr);padding:40px 48px;gap:16px}}
.benefit{position:relative;overflow:hidden;isolation:isolate;background:var(--teal-3);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px;min-height:170px}
.benefit .ring{position:absolute;right:-34px;top:-34px;width:104px;height:104px;border-radius:50%;border:1.5px solid var(--teal);z-index:-1;opacity:.8}
.benefit .bt{font-weight:600;font-size:15.5px;line-height:1.3}
.benefit .bd{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.how{max-width:1180px;margin:0 auto;padding:20px 18px 40px}
@media (min-width:960px){.how{padding:30px 48px 60px}}
.how h2{font-weight:300;font-size:30px;margin:6px 0 20px;letter-spacing:-.01em}
.how ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:18px;counter-reset:s}
@media (min-width:720px){.how ol{grid-template-columns:repeat(3,1fr)}}
.how li{counter-increment:s;display:flex;gap:14px;align-items:flex-start}
.how li::before{content:counter(s);width:40px;height:40px;border-radius:50%;border:1.5px solid var(--teal);display:grid;place-items:center;font-weight:300;font-size:18px;flex:none}
.how li b{display:block;font-weight:600;margin-bottom:4px}
.how li span{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.land-foot{max-width:1180px;margin:0 auto;padding:22px 18px calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--ink-2)}
@media (min-width:960px){.land-foot{padding:26px 48px 36px}}
.land-foot a{color:inherit}

/* auth / wizard page */
.page-narrow{max-width:620px;margin:0 auto;padding:0 18px calc(40px + env(safe-area-inset-bottom,0px));position:relative;isolation:isolate}
.page-narrow.wide{max-width:980px}
.wiz-head{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px}
.wiz-head .logo{height:24px}
.wiz-title{font-weight:300;font-size:30px;line-height:1.1;letter-spacing:-.01em;margin:4px 0 6px}
@media (min-width:960px){.wiz-title{font-size:40px;font-weight:200}}
.example{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:4px}
.example .x{background:var(--surface);border-radius:14px;padding:12px}
.example .x .k{font-size:11.5px;color:var(--ink-2);font-weight:600}
.example .x .v{font-weight:300;font-size:22px;font-variant-numeric:tabular-nums;margin-top:4px;line-height:1.1;overflow-wrap:anywhere}
.example .x.hl{background:var(--teal-2)}
@media (max-width:400px){.example{grid-template-columns:1fr 1fr}.example .x:first-child{grid-column:1/-1}}

/* map */
.map{height:320px;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--surface);position:relative;z-index:0}
.map.tall{height:440px}
@media (min-width:960px){.map.tall{height:560px}}
.map .leaflet-tile-pane{filter:var(--tile-filter)}
.leaflet-container{font-family:var(--font)!important;background:var(--surface)!important}
.leaflet-control-attribution{font-size:10px!important}
.leaflet-bar a{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important}
.pin-ic{background:none;border:0}
.pin{position:relative;display:block;width:34px;height:44px}
.pin::before{content:"";position:absolute;left:3px;top:0;width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--ink);box-shadow:0 4px 10px rgba(0,0,0,.25)}
.pin::after{content:"";position:absolute;left:11px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--teal)}
.pin.teal::before{background:var(--teal-ink)}
.pin.teal::after{background:#fff}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card)!important;color:var(--ink)!important}
.leaflet-popup-content{font-size:13px;margin:10px 14px!important}
.geo-results{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.geo-results button{text-align:left;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:13.5px;line-height:1.35}
.geo-results button:hover{background:var(--teal-3)}

/* ---------- kassa ---------- */
.scan-hero{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 18px 28px;border-radius:var(--r-xl);background:var(--ink);color:var(--on-ink);text-align:center}
.scan-hero .rings{width:320px;right:-130px;top:-130px}
.scan-hero .rings i{border-color:rgba(150,213,210,.28)}
.scan-hero .rings i:nth-child(3){border-color:var(--teal);opacity:.5}
.scan-hero .big{width:104px;height:104px;border-radius:50%;background:var(--teal);color:#231F20;display:grid;place-items:center;box-shadow:0 0 0 12px rgba(150,213,210,.16),0 0 0 28px rgba(150,213,210,.07),0 0 0 44px var(--ink),0 0 0 45.5px rgba(150,213,210,.35);margin:44px 0 30px}
.scan-hero .big .ico{width:46px;height:46px;stroke-width:1.5}
.scan-hero .st{font-weight:300;font-size:25px;line-height:1.15;letter-spacing:-.01em}
.scan-hero .ss{font-size:13px;opacity:.7;max-width:34ch}
.scan-hero:hover .big{filter:brightness(1.04)}
.scan-alt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.scan-alt .btn{padding:0 10px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.hid{font-weight:200;font-size:clamp(26px,8.2vw,40px);letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.05;white-space:nowrap}
.client-head{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--r-lg);background:var(--teal-3)}
.client-head .rings{width:220px;right:-80px;top:-70px}
.preview-pts{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:14px;background:var(--surface)}
.preview-pts .p{font-weight:300;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.preview-pts .p small{font-size:13px;font-weight:600;color:var(--ink-2);margin-left:4px}
.coupon{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--line-2)}
.coupon .code{font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.success{position:relative;isolation:isolate;overflow:hidden;text-align:center;padding:26px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.success .rings{width:360px;left:50%;top:-40px;transform:translateX(-50%)}
.success .ok-ring{width:92px;height:92px;border-radius:50%;background:var(--ok-bg);color:var(--ok-t);display:grid;place-items:center;margin-bottom:10px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.success .ok-ring .ico{width:44px;height:44px;stroke-width:2}
.success .pts{font-weight:200;font-size:58px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* scanner overlay */
.scan{position:fixed;inset:0;z-index:120;background:#000;color:#fff;display:flex;flex-direction:column}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-shade{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.scan-frame{position:relative;width:min(72vw,300px);aspect-ratio:1;border-radius:28px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
.scan-frame i{position:absolute;width:44px;height:44px;border:4px solid var(--teal)}
.scan-frame i:nth-child(1){left:-2px;top:-2px;border-right:0;border-bottom:0;border-radius:28px 0 0 0}
.scan-frame i:nth-child(2){right:-2px;top:-2px;border-left:0;border-bottom:0;border-radius:0 28px 0 0}
.scan-frame i:nth-child(3){left:-2px;bottom:-2px;border-right:0;border-top:0;border-radius:0 0 0 28px}
.scan-frame i:nth-child(4){right:-2px;bottom:-2px;border-left:0;border-top:0;border-radius:0 0 28px 0}
.scan-line{position:absolute;left:10%;right:10%;height:2px;background:var(--teal);box-shadow:0 0 12px var(--teal);top:50%;animation:scanl 2.2s ease-in-out infinite}
@keyframes scanl{0%,100%{top:18%}50%{top:82%}}

.pkm{position:relative;text-align:left;padding:14px 12px 12px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:3px;min-height:104px;min-width:0}

.pk-cmpd summary{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;cursor:pointer;list-style:none;padding:4px 0 12px}

.pk-cmpd[open] summary .chev{transform:rotate(180deg)}
.pk-tbl{min-width:620px}
.tbl.pk-tbl th,.tbl.pk-tbl td{text-align:center}

@media (min-width:960px){.pk-cmpw{overflow:visible}.pk-tbl{min-width:0}.pk-tbl thead th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}}
.pk-notes{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin:14px 0 0}
.pk-chip{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:999px;background:var(--teal-2);color:var(--ink);font-size:10.5px;font-weight:700;letter-spacing:.03em;vertical-align:1px;white-space:nowrap}

.pk-curcard{position:relative;isolation:isolate;overflow:hidden}
/* аватары: логотип / фото поверх букв; не загрузилось — картинка убирается */
.av,.mu-prev{position:relative;overflow:hidden}
.av .plogo,.mu-prev .plogo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.side-foot .who{display:flex;align-items:center;gap:8px}
.side-foot .who .av{width:24px;height:24px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
/* загрузка логотипа и фото */
.media-up{display:flex;gap:14px;align-items:flex-start;padding:12px;border-radius:16px;border:1.5px dashed var(--line-2);transition:border-color .15s,background .15s}

/* живой предпросмотр «как в приложении водителя» */
.set-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.set-cols>.pv-col{order:-1}
@media (min-width:1100px){.set-cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:"f p" "f r";gap:32px;align-items:start}.set-cols>.set-forms{grid-area:f}.set-cols>.pv-col{grid-area:p;order:0}.set-cols>.set-rest{grid-area:r}}
.pv-box summary{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;cursor:pointer;list-style:none}
.pv-box summary::-webkit-details-marker{display:none}
.pv-box summary .chev{margin-left:auto;transition:transform .2s}
.pv-box[open] summary .chev{transform:rotate(180deg)}
.pv-ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin:14px 0}
.pv-stage{display:flex;justify-content:center}
.dpv-frame{padding:10px;border-radius:44px;background:#101516;box-shadow:0 30px 60px rgba(0,0,0,.18),inset 0 0 0 2px #2b3334}
.dpv-vp{position:relative;overflow:hidden;border-radius:34px;width:calc(375px * var(--k,.8));height:calc(760px * var(--k,.8))}
.dpv-scr{position:absolute;top:0;left:0;width:375px;height:760px;transform:scale(var(--k,.8));transform-origin:0 0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased;text-align:left}
.dpv-scr *{box-sizing:border-box}
.dpv-scr .dpv-st{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 26px;font-size:14px;font-weight:600}
.dpv-scr .dpv-body{padding:0 18px 90px}
.dpv-scr .dpv-tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px 18px;background:var(--bar-bg);border-top:1px solid var(--line)}
.dpv-scr .dpv-dim{position:absolute;inset:0;background:rgba(10,14,15,.42)}
.dpv-scr .dpv-sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:var(--shadow-up)}
.dpv-scr .dpv-sheet .sheet-body{overflow:hidden}
.dpv-scr .ghost{opacity:.45}
.dpv-scr .pv-ex{position:absolute;bottom:12px;right:12px}
/* --- Предпросмотр «как в приложении водителя»: копия токенов и стилей 06_WEB/index.html (карточки акций/плюшек, лист компании). Меняете там — обновите здесь. --- */
.dpv-scr{
  --teal:#96D5D2; --teal-2:#C9E9E6; --teal-3:#EEF7F6; --teal-ink:#1F6E69;

  --tabbar-h:64px;
  --logo-light:block; --logo-dark:none;
  --font:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --r-xl:26px; --r-lg:20px; --r-md:14px; --r-sm:10px;
}
.dpv-scr[data-pv="dark"]{
  color-scheme:dark;
  --teal:#96D5D2; --teal-2:#24413F; --teal-3:#142726; --teal-ink:#9ADAD6;
  --ink:#EEF3F2; --ink-2:#AAB7B6; --ink-3:#7A8A89;
  --bg:#0E1314; --bg-outer:#070A0B; --surface:#161F20; --card:#172122; --line:#243234; --line-2:#30413F;

  --none:#4E5D5C;
  --c1:#1aa39a; --c2:#d9683a; --c3:#6f64e0; --c4:#d65590; --c5:#3d86e0; --c6:#a8852e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);

}
