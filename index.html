/* ================= Приглашения: закрытый запуск, ссылка друга, «Пригласить друга» (04_AUTOMATION/docs/INVITES_API.md) =================
   Код приглашения = Helper ID друга (HLP-XXXXXX) или код из бумажного ежедневника (HLP-XXXX-XXXX). Ссылка ?ref=… сохраняется как
   ожидающее приглашение, проверяется на сервере и отправляется при регистрации. Ценность километров Helper в деньгах нигде не показывается. */
let INV = jget(K_INV), ST = jget(K_STATUS), RF = jget(K_REF), SEEN_NOTICES = jget(K_NOTICES) || [], invP = null, stP = null, rfP = null, invFail = false;
const closedMode = () => ST && ST.at ? !!ST.invite_only : true; /* статус неизвестен (офлайн, нет сервера) — считаем закрытым */
/* Пилот (закрытый запуск): без аккаунта данные на устройстве не заводятся — сначала регистрация по приглашению или вход,
   авто и журнал сразу сохраняются на сервере. В открытом режиме (после порога) — как раньше: можно без регистрации. */
const acctFirst = () => !logged() && closedMode();
function inviteCapture() {
  let code = '';
  try {
    code = new URLSearchParams(location.search).get('ref') || '';
    if (!code) code = new URLSearchParams((location.hash || '').replace(/^#\??/, '')).get('ref') || '';
  } catch (e) {}
  code = String(code || '').trim().slice(0, 40);
  if (!code) return;
  INV = {code, at: Date.now(), check: null, checkedAt: 0};
  jset(K_INV, INV);
  try { /* убрать ref из адреса, остальное (вкладка, tgWebAppData) оставить */
    const q = new URLSearchParams(location.search); q.delete('ref');
    let hash = location.hash;
    const h = new URLSearchParams((hash || '').replace(/^#\??/, ''));
    if (h.has('ref')) { h.delete('ref'); hash = h.toString() ? '#' + h.toString() : ''; }
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString() : '') + hash);
  } catch (e) {}
}
function inviteWelcomeRefresh() { if (ui.onb && ui.onb.step === 'acct') render(false); }
function inviteCheck(force) {
  if (!INV || !INV.code) return Promise.resolve(null);
  if (invP) return invP;
  if (!force && INV.check && Date.now() - (INV.checkedAt || 0) < 600000) return Promise.resolve(INV.check);
  const code = INV.code, fresh = !INV.check;
  invFail = false;
  invP = api('/v1/auth/invite/' + encodeURIComponent(code), {auth: false}).then(d => {
    if (!INV || INV.code !== code || !d) return null;
    INV.check = {valid: !!d.valid, kind: d.kind || null, reason: d.reason || null, inviter: d.inviter || null, days: +d.referral_bonus_days || 30, message: d.message || ''};
    INV.checkedAt = Date.now(); jset(K_INV, INV);
    if (d.valid && fresh && !logged() && !(ui.onb && ui.onb.step === 'acct')) toast(inviteText(INV.check));
    inviteWelcomeRefresh();
    return INV.check;
  }, () => { invFail = true; if (INV && INV.code === code && !INV.check) inviteWelcomeRefresh(); return null; }).finally(() => { invP = null; });
  return invP;
}
function inviteClear() { INV = null; jset(K_INV, null); }
/* причина «код не подошёл» пришла текстом сервера на прежнем языке — при смене языка спросить заново */
onLang(() => { if (S && INV && INV.check && !INV.check.valid && !logged()) inviteCheck(true); }); /* S — после запуска (onLang вызывает сразу) */
function statusLoad(force) {
  if (stP) return stP;
  if (!force && ST && ST.at && Date.now() - ST.at < 60000) return Promise.resolve(ST);
  stP = api('/v1/status', {auth: false}).then(d => {
    if (d && typeof d.invite_only === 'boolean') {
      ST = Object.assign({}, d, {at: Date.now()}); jset(K_STATUS, ST);
      /* закрыто, а на экране — приветствие «Добавить авто» без аккаунта: сначала аккаунт */
      if (ui.onb && ui.onb.step === 0 && acctFirst()) { ui.onb.step = 'acct'; render(false); } else inviteWelcomeRefresh();
      liveRender(['home']);
    }
    return ST;
  }, () => ST).finally(() => { stP = null; });

  list.forEach(n => {
    if (!n || !n.id || SEEN_NOTICES.indexOf(n.id) >= 0) return;

/* ================= Вход через Google (Google Identity Services — только сайт / PWA) =================
   Кнопка есть, только если сервер вернул google_client_id в /v1/status. В приложениях iOS/Android (WebView: Google не

   ID token → POST /v1/auth/google {credential, ref?, device, language} → те же токены, что у пароля, дальше — afterAuth.
   Закрыто и нет кода приглашения → лист «Код приглашения» (удостоверение Google живёт ~1 ч — держим в памяти и повторяем). */

    mode = 'first'; step = 'acct';

const NOTIF_BASE = 7000, NOTIF_MAX = 60;
let notifT = null, notifAsked = false;
function at10(iso) { const d = pd(iso); d.setHours(10, 0, 0, 0); return d; }
function nativeReminders() {
  const out = [], now = Date.now(), T = todayISO();
  const push = (when, title, body, extra) => { if (when && when.getTime() > now + 60000) out.push({when, title, body, extra: extra || {}}); };
  S.cars.forEach(car => {
    const kpd = kmPerDay(car), name = carName(car);
    serviceList(car).forEach(x => {
      if (x.status === 'none') return;
      if (x.status === 'bad') { push(at10(addDays(T, 1)), t('notif.overdue', {item: x.item.n.toLowerCase()}), name + ' · ' + svcText(x), {tab: 'car'}); return; }
      const p = typeof predict === 'function' ? predict(x, kpd) : null;
      if (!p) return;
      push(at10(addDays(p.d, -3)), t('notif.soon', {item: x.item.n.toLowerCase()}), t('notif.soonBody', {car: name}), {tab: 'car'});
      push(at10(p.d), t('notif.due', {item: x.item.n.toLowerCase()}), t('notif.dueBody', {car: name}), {tab: 'car'});
    });
    if (isPrem()) carDocs(car.id).forEach(d => {
      if (d.type === 'license') return;
      [30, 7, 1].forEach(n => push(at10(addDays(d.expires, -n)), t('notif.docLeft', {doc: DOCT[d.type][0], days: fDays(n)}), t('notif.docBody', {car: name}), {tab: 'home'}));
    });
    push(at10(addDays(car.odoAt || T, S.settings.remindDays || 15)), t('notif.odoTitle'), t('notif.odoBody', {car: name}), {tab: 'home'});
  });
  out.sort((a, b) => a.when - b.when);
  return out.slice(0, NOTIF_MAX);
}

function nativeSchedule() { if (!CAP) return; clearTimeout(notifT); notifT = setTimeout(nativeScheduleNow, 800); }

/* ===================== Язык: переключение, выбор, язык аккаунта ===================== */
/* Неизменная «оболочка» страницы: нижнее меню, подписи для экранного диктора, описание страницы */
function shellI18n() {

/* ===================== Тема: Системная / Светлая / Тёмная (на этом устройстве) =====================

   :root[data-theme="dark"] и @media dark для :root:not([data-theme="light"]) — тёмная). QR-коды всегда тёмные на белом. */
const THEME_KEY = 'helper.theme.v1', THEMES = ['auto', 'light', 'dark'], THEME_BG = {light: '#FFFFFF', dark: '#0E1314'};
const THM_T = {auto: 'settings.themeAuto', light: 'settings.themeLight', dark: 'settings.themeDark'};
const THM_IC = {
  auto: '<svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg>',
  light: '<svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',
  dark: '<svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z"/></svg>'
};
const THM_CK = '<svg class="ico sm ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
let themeMem = null, themeSig = '', thmOpen = null;
const themeGet = () => { let v = themeMem; try { v = localStorage.getItem(THEME_KEY) || v; } catch (e) {} return THEMES.indexOf(v) >= 0 ? v : 'auto'; };

const themeDark = () => { const v = themeGet(); return v === 'dark' || (v === 'auto' && osDark()); };
/* data-theme на <html>, цвет строки состояния браузера (theme-color) и нативного StatusBar (Capacitor, если плагин есть) */
function themeApply() {

  try {
    const SB = CAP && NP.StatusBar;
    if (SB && SB.setStyle) {
      Promise.resolve(SB.setStyle({style: dark ? 'DARK' : 'LIGHT'})).catch(() => {});
      if (IS_AND && SB.setBackgroundColor) Promise.resolve(SB.setBackgroundColor({color: dark ? THEME_BG.dark : THEME_BG.light})).catch(() => {});

}
/* кнопки Google рисует GIS в своих iframe — после смены темы нарисовать заново */
function gRedraw() { const els = $$('[data-gbtn]'); if (!els.length) return; els.forEach(el => { el.innerHTML = ''; }); gMount(); }
function themeSet(v) {
  if (THEMES.indexOf(v) < 0) return;

  themeApply();
  if (S) render();
  gRedraw();
}
/* кнопка темы рядом с языком: значок текущего режима, по нажатию — меню из трёх пунктов */
function thmBtn() {
  const v = themeGet(), lb = t('settings.theme') + ': ' + t(THM_T[v]);
  return '<button type="button" class="thm-btn" data-act="thm-menu" aria-haspopup="menu" aria-expanded="false" aria-label="' + esc(lb) + '" title="' + esc(lb) + '">' + THM_IC[v] + '</button>';
}
function thmMenu(btn) {

  const cur = themeGet(), m = document.createElement('div');
  m.className = 'thm-menu'; m.setAttribute('role', 'menu'); m.setAttribute('aria-label', t('settings.theme'));
  setHTML(m, THEMES.map(v => '<button type="button" role="menuitemradio" tabindex="-1" aria-checked="' + (v === cur) + '" data-act="thm-set" data-v="' + v + '">' + THM_IC[v] + '<span>' + t(THM_T[v]) + '</span>' + (v === cur ? THM_CK : '') + '</button>').join(''));
  document.body.appendChild(m);

    else if (e.key === 'ArrowUp') { e.preventDefault(); at(i - 1); }

/* Переключатель языка: compact — «RU · RO · EN» (экраны приветствия), иначе — названия языков (Ещё → Настройки → Язык) */

/* Смена языка без перезагрузки: словари и форматы → таблицы (onLang) → оболочка и текущий экран → напоминания, акции, язык аккаунта.
