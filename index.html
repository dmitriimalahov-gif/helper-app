<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helper</title>
<meta name="description" content="Helper — сервисная книжка автомобиля: напоминания о ТО по пробегу, журнал работ, расходы и справочник.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1314" media="(prefers-color-scheme: dark)">
<script>/* тема до первой отрисовки (без вспышки): helper.theme.v1 = auto | light | dark — выбор на этом устройстве */
(function(){try{var t=localStorage.getItem('helper.theme.v1');if(!t){var m=/"theme":"(light|dark)"/.exec(localStorage.getItem('helper.app.v1')||'');t=m?m[1]:'auto'}if(t!=='light'&&t!=='dark')return;document.documentElement.setAttribute('data-theme',t);var c=t==='dark'?'#0E1314':'#FFFFFF',ms=document.querySelectorAll('meta[name="theme-color"]');for(var i=0;i<ms.length;i++)ms[i].setAttribute('content',c)}catch(e){}})();</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Helper">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&amp;display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<style>
:root{
  --teal:#96D5D2; --teal-2:#C9E9E6; --teal-3:#EEF7F6; --teal-ink:#1F6E69;
  --ink:#231F20; --ink-2:#56605F; --ink-3:#86908F;
  --bg:#FFFFFF; --bg-outer:#E9F1F0; --surface:#F3F7F7; --card:#FFFFFF; --line:#E2EAE9; --line-2:#CFDBDA;
  --bar-bg:rgba(255,255,255,.9);
  --on-teal:#231F20; --on-ink:#FFFFFF;
  --ok:#2E9A5E; --ok-bg:#E4F4EA; --ok-t:#1D7444;
  --soon:#D18F14; --soon-bg:#FBF0D9; --soon-t:#8A5A00;
  --bad:#D2433A; --bad-bg:#FBE5E3; --bad-t:#B0302A;
  --none:#A9B3B2;
  --c1:#159a92; --c2:#e0703c; --c3:#5a4fc9; --c4:#d4588f; --c5:#2a78d6; --c6:#9c7b1f;
  --shadow:0 1px 2px rgba(35,31,32,.05),0 10px 30px rgba(35,31,32,.07);
  --shadow-up:0 -8px 30px rgba(35,31,32,.10);
  --font:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-xl:26px; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --tabbar-h:64px;
  --logo-light:block; --logo-dark:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --teal:#96D5D2; --teal-2:#24413F; --teal-3:#142726; --teal-ink:#9ADAD6;
    --ink:#EEF3F2; --ink-2:#AAB7B6; --ink-3:#7A8A89;
    --bg:#0E1314; --bg-outer:#070A0B; --surface:#161F20; --card:#172122; --line:#243234; --line-2:#30413F;
    --bar-bg:rgba(14,19,20,.9);
    --on-teal:#0E1314; --on-ink:#0E1314;
    --ok:#4CC27F; --ok-bg:#15301F; --ok-t:#79DBA1;
    --soon:#E7A93A; --soon-bg:#33270F; --soon-t:#F2C063;
    --bad:#EF6A60; --bad-bg:#3A1A18; --bad-t:#FF9A90;
    --none:#4E5D5C;
    --c1:#1aa39a; --c2:#d9683a; --c3:#6f64e0; --c4:#d65590; --c5:#3d86e0; --c6:#a8852e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    --shadow-up:0 -8px 30px rgba(0,0,0,.45);
    --logo-light:none; --logo-dark:block;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --teal:#96D5D2; --teal-2:#24413F; --teal-3:#142726; --teal-ink:#9ADAD6;
  --ink:#EEF3F2; --ink-2:#AAB7B6; --ink-3:#7A8A89;
  --bg:#0E1314; --bg-outer:#070A0B; --surface:#161F20; --card:#172122; --line:#243234; --line-2:#30413F;
  --bar-bg:rgba(14,19,20,.9);
  --on-teal:#0E1314; --on-ink:#0E1314;
  --ok:#4CC27F; --ok-bg:#15301F; --ok-t:#79DBA1;
  --soon:#E7A93A; --soon-bg:#33270F; --soon-t:#F2C063;
  --bad:#EF6A60; --bad-bg:#3A1A18; --bad-t:#FF9A90;
  --none:#4E5D5C;
  --c1:#1aa39a; --c2:#d9683a; --c3:#6f64e0; --c4:#d65590; --c5:#3d86e0; --c6:#a8852e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-up:0 -8px 30px rgba(0,0,0,.45);
  --logo-light:none; --logo-dark:block;
}

*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;background:var(--bg-outer)}
body{margin:0;min-height:100%;background:var(--bg-outer);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--teal-ink)}
svg{display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:18px;height:18px}
.ico.xs{width:15px;height:15px;stroke-width:1.9}
.num,.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--teal-ink);outline-offset:2px;border-radius:8px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.notch{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
#app{position:relative;max-width:440px;margin:0 auto;min-height:100%;min-height:100vh;background:var(--bg);overflow-x:clip}
@media (min-width:600px){#app{box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.08)}}
#view{position:relative;z-index:0;padding:0 18px calc(var(--tabbar-h) + 34px + env(safe-area-inset-bottom,0px))}
#view.noTab{padding-bottom:40px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin:0 -18px;padding:10px 18px 8px;background:var(--bar-bg);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);display:flex;align-items:center;gap:10px;min-height:56px}
.topbar.flat{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
.topbar .grow{flex:1;min-width:0}
.topbar h1.small{font-size:17px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:var(--surface);flex:none}
.iconbtn:hover{background:var(--teal-3)}
.iconbtn.ghost{background:transparent}
.logo{height:26px;width:auto}
.logo.big{height:46px}
.logo-wrap{display:flex;align-items:center}
.topbar.home{position:relative;top:auto;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;padding-top:14px}
.tb-title{margin:0;font-weight:300;font-size:26px;letter-spacing:-.01em;line-height:1.15}
.tb-sub{margin:1px 0 0;font-size:12.5px;color:var(--ink-2)}
[hidden]{display:none!important}
.logo.l{display:var(--logo-light)} .logo.d{display:var(--logo-dark)}
.sos{height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--bad);color:var(--bad-t);font-weight:700;font-size:13px;letter-spacing:.08em;display:flex;align-items:center;gap:6px;background:transparent}
.sos:hover{background:var(--bad-bg)}
.large-title{font-weight:300;font-size:31px;letter-spacing:-.01em;line-height:1.1;margin:6px 0 2px;text-wrap:balance}
.subtitle{color:var(--ink-2);font-size:13.5px;margin:0}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0}
.section{margin-top:26px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.section-head .link{font-size:13px;font-weight:600;color:var(--teal-ink);display:inline-flex;align-items:center;gap:4px}
.muted{color:var(--ink-2)} .muted-3{color:var(--ink-3)}
.small{font-size:13px}.xsmall{font-size:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.wrap{flex-wrap:wrap}

/* corner ring motif */
.corner-ring{position:absolute;pointer-events:none;border-radius:50%;border:1.5px solid var(--teal-2);z-index:-1}
.hero-wrap{position:relative}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:40;background:var(--bar-bg);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border-top:1px solid var(--line);padding:6px 6px env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 7px;color:var(--ink-3);font-size:10.5px;font-weight:600;letter-spacing:.01em;border-radius:14px}
.tab .pill{width:52px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .pill{background:var(--teal-2)}
.tabbar.hidden{display:none}

/* ---------- buttons ---------- */
.btn{height:50px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;background:var(--teal);color:var(--on-teal);transition:transform .12s, filter .12s;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.soft{background:var(--surface);color:var(--ink)}
.btn.line{background:transparent;border:1.5px solid var(--line-2);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad-t)}
.btn.sm{height:38px;padding:0 16px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:10px}
.btn-row>.btn{flex:1}
.textbtn{color:var(--teal-ink);font-weight:600;font-size:14px;padding:8px 2px}
.fab{position:fixed;right:max(18px,calc(50% - 220px + 18px));bottom:calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom,0px));z-index:35;width:58px;height:58px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;box-shadow:0 8px 24px rgba(35,31,32,.22)}
.fab .ico{width:26px;height:26px;stroke-width:2}

/* ---------- chips / pills ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none;border:1px solid transparent}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.status{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-ok{background:var(--ok-bg);color:var(--ok-t)}
.st-soon{background:var(--soon-bg);color:var(--soon-t)}
.st-bad{background:var(--bad-bg);color:var(--bad-t)}
.st-none{background:var(--surface);color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--teal-2);color:var(--ink)}
.badge.dark{background:var(--ink);color:var(--on-ink)}
.badge.warn{background:var(--soon-bg);color:var(--soon-t)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:999px;padding:4px;gap:4px}
.seg button{height:34px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.teal button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal)}

/* ---------- cards / lists ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card.tint{background:var(--teal-3);border-color:transparent}
.card.shadow{box-shadow:var(--shadow);border-color:transparent}
.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;position:relative;min-height:60px}
.item+.item::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line)}
.item:hover{background:var(--surface)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14.5px;line-height:1.3}
.item .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.item .end{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.item .chev{color:var(--ink-3)}
.ic-circle{width:38px;height:38px;border-radius:50%;background:var(--teal-3);color:var(--ink);display:grid;place-items:center;flex:none}
.ic-circle.ok{background:var(--ok-bg);color:var(--ok-t)}
.ic-circle.soon{background:var(--soon-bg);color:var(--soon-t)}
.ic-circle.bad{background:var(--bad-bg);color:var(--bad-t)}
.ic-circle.ink{background:var(--ink);color:var(--on-ink)}
.bar{height:5px;border-radius:5px;background:var(--surface);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--ok)}
.bar.soon>i{background:var(--soon)} .bar.bad>i{background:var(--bad)} .bar.none>i{background:var(--none)}
.empty{text-align:center;padding:34px 20px;color:var(--ink-2)}
.empty .ring{width:64px;height:64px;border-radius:50%;border:2px solid var(--teal-2);display:grid;place-items:center;margin:0 auto 12px;color:var(--teal-ink)}

/* ---------- home ---------- */
.car-title{display:flex;align-items:center;gap:8px;font-weight:300;font-size:30px;letter-spacing:-.01em;line-height:1.1;margin-top:4px;text-align:left}
.car-title .ico{color:var(--ink-3)}
.demo-banner{margin-top:14px;width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--ink);color:var(--on-ink);text-align:left}
.demo-banner .t{font-weight:600;font-size:13.5px;line-height:1.3}
.demo-banner .s{font-size:12px;opacity:.72;margin-top:2px}
.demo-banner .go{width:32px;height:32px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;flex:none}
.hero{position:relative;margin-top:14px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center}
.gauge{position:relative;width:min(300px,82vw);aspect-ratio:1;max-width:100%}
.gauge svg{width:100%;height:100%;overflow:visible}
.gauge .g-top{position:absolute;left:14%;right:14%;top:21%;text-align:center}
.gauge .g-bot{position:absolute;left:12%;right:12%;top:55%;text-align:center}
.gauge .g-label{font-size:13.5px;font-weight:600;line-height:1.25;text-wrap:balance}
.gauge .g-eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
.gauge .g-num{font-weight:200;font-size:clamp(40px,13vw,54px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gauge .g-unit{font-size:12.5px;color:var(--ink-2);margin-top:4px;font-weight:500}
.hero-meta{display:flex;align-items:center;gap:8px;margin-top:2px;flex-wrap:wrap;justify-content:center}
.hero-actions{display:flex;gap:10px;margin-top:16px;width:100%}
.hero-actions .btn{flex:1;padding:0 12px}
.odo{display:flex;align-items:center;gap:14px}
.odo .v{font-weight:300;font-size:30px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1}
.odo .u{font-size:13px;color:var(--ink-2);margin-left:4px}
.remind{display:flex;gap:12px;align-items:flex-start}
.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.doc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.doc:hover{border-color:var(--line-2)}
.doc .dn{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.doc .dv{font-weight:300;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.doc .dd{font-size:11.5px;color:var(--ink-3)}
.doc.add{border-style:dashed;align-items:flex-start;justify-content:center;color:var(--ink-2)}
.doc.soon{border-color:var(--soon)} .doc.bad{border-color:var(--bad)}
.alert{display:flex;gap:12px;padding:14px;border-radius:var(--r-md);background:var(--soon-bg);color:var(--ink)}
.alert.bad{background:var(--bad-bg)}
.alert .t{font-weight:600;font-size:14px}
.alert .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}

/* ---------- journal ---------- */
.month{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 8px}
.month h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.month span{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sumline{display:flex;gap:18px;margin-top:12px}
.sumline .k{font-size:11.5px;color:var(--ink-2)}
.sumline .v{font-weight:300;font-size:22px;font-variant-numeric:tabular-nums}

/* ---------- stats ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:var(--r-md);padding:12px 14px}
.kpi .k{font-size:11.5px;color:var(--ink-2);font-weight:600}
.kpi .v{font-weight:300;font-size:25px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.kpi .v small{font-size:12px;font-weight:500;color:var(--ink-2);margin-left:3px}
.bignum{font-weight:200;font-size:46px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-size:15px;font-weight:500;color:var(--ink-2);margin-left:6px;letter-spacing:0}
.chart{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink-2);font-family:var(--font);font-size:10px;font-weight:500}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart-cap{font-size:12.5px;color:var(--ink-2);min-height:18px;margin-top:6px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.legend .li{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13.5px}
.legend .sw{width:12px;height:12px;border-radius:4px}
.legend .pct{color:var(--ink-2);font-size:12px;width:38px;text-align:right;font-variant-numeric:tabular-nums}
.legend .amt{font-variant-numeric:tabular-nums;font-weight:600}
.donut-wrap{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
/* на телефоне — диаграмма над легендой: названия категорий (особенно ro/en) и суммы помещаются целиком */
@media (max-width:440px){.donut-wrap{grid-template-columns:1fr;justify-items:center;gap:12px}.donut-wrap .legend{width:100%}}

/* locked */
.locked{position:relative;border-radius:var(--r-lg);overflow:hidden}
.locked .blur{filter:blur(7px);opacity:.55;pointer-events:none;user-select:none}
.locked .lock-card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
.lock-card .lk{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center}
.lock-card .t{font-weight:600;font-size:15px;max-width:290px;text-wrap:balance}
.lock-card .s{font-size:12.5px;color:var(--ink-2);max-width:280px}
.soft-lock{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);width:100%;text-align:left}
.soft-lock .t{font-size:13px;font-weight:600}
.soft-lock .s{font-size:12px;color:var(--ink-2)}

/* ---------- guide ---------- */
.search{position:relative}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{padding-left:42px}
.art-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.art{isolation:isolate;background:var(--teal-3);border-radius:var(--r-md);padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:128px;position:relative;overflow:hidden}
.art.wide{grid-column:1/-1;background:var(--ink);color:var(--on-ink);min-height:0}
.art .at{font-weight:600;font-size:14px;line-height:1.3;text-wrap:balance}
.art .tag{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.art .ring{z-index:-1;position:absolute;right:-26px;bottom:-26px;width:84px;height:84px;border-radius:50%;border:1.5px solid var(--teal)}
.art.wide .ring{border-color:var(--teal);right:-20px;top:-30px;bottom:auto;width:110px;height:110px;opacity:.7}
.article{max-width:65ch}
.article h2{font-weight:300;font-size:28px;line-height:1.15;margin:8px 0 8px;letter-spacing:-.01em;text-wrap:balance}
.article h3{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:26px 0 8px}
.article p,.article li{font-weight:400;font-size:15.5px;line-height:1.6}
.article ul,.article ol{padding-left:20px;margin:6px 0}
.article li{margin:6px 0}
.article .lead{font-size:16px;color:var(--ink-2);font-weight:400}
.article dl{margin:0}
.article dt{font-weight:600;margin-top:14px}
.article dd{margin:4px 0 0;font-weight:400;line-height:1.6}
.tip{margin-top:22px;padding:14px 16px;border-radius:var(--r-md);background:var(--teal-3);display:flex;gap:12px;font-weight:500;font-size:14px;line-height:1.5}
.kb-sec{padding:16px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:38px 1fr;gap:12px}
.kb-sec h3{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.kb-sec p{margin:0;font-weight:400;font-size:15px;line-height:1.6}
.interval{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--on-ink);border-radius:var(--r-md);padding:14px 16px;margin-top:6px}
.interval .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;font-weight:600}
.interval .v{font-weight:500;font-size:15px}
mark{background:var(--teal-2);color:inherit;border-radius:3px;padding:0 1px}

/* SAE */
.sae-pick{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.sae-pick select{text-align:center;font-size:20px;font-weight:600;height:56px}
.sae-code{font-weight:200;font-size:56px;letter-spacing:-.02em;text-align:center;line-height:1;margin:18px 0 6px;font-variant-numeric:tabular-nums}
.sae-code b{font-weight:500;color:var(--teal-ink)}
.thermo{margin:16px 0 4px}
.thermo .scale{position:relative;height:12px;border-radius:12px;background:linear-gradient(90deg,#4f86d9,#9ad0e6 45%,#e9d38a 70%,#e0703c)}
.thermo .range{position:absolute;top:-5px;bottom:-5px;border:2.5px solid var(--ink);border-radius:12px}
.thermo .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-top:8px;font-variant-numeric:tabular-nums}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;font-weight:500;color:var(--ink);appearance:none;-webkit-appearance:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea.input{height:auto;min-height:92px;padding:12px 14px;line-height:1.45;resize:vertical}
#au-ref,#gr-code,#iv-code{letter-spacing:.04em;font-variant-numeric:tabular-nums}
#au-ref[readonly]{background:var(--teal-3);border-color:transparent}
.gwrap{display:flex;flex-direction:column;gap:12px}
.gslot{display:flex;justify-content:center;min-height:44px}
.gslot.busy{opacity:.5;pointer-events:none}
.or-div{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12.5px;font-weight:500}
.or-div::before,.or-div::after{content:'';flex:1;height:1px;background:var(--line)}
textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;min-height:180px}
.input:focus{outline:none;border-color:var(--teal-ink);box-shadow:0 0 0 3px var(--teal-2)}
.input[aria-invalid="true"]{border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.form{display:flex;flex-direction:column;gap:14px}
.hint{font-size:12px;color:var(--ink-3)}
.err{font-size:12.5px;color:var(--bad-t);font-weight:600}
.opt-grid{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line-2);font-size:13.5px;font-weight:600;color:var(--ink-2);background:transparent}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.opt:disabled{opacity:.45}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:30px;background:var(--line-2);position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stepper button{height:44px;border-radius:12px;background:var(--surface);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.stepper button:hover{background:var(--teal-3)}
.odo-input{font-weight:200;font-size:44px;height:74px;text-align:center;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-radius:12px;background:var(--teal-3)}
.total .v{font-weight:300;font-size:24px;font-variant-numeric:tabular-nums}
.total .tot-l{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.total .tot-r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.total{align-items:center}
.cur-sel{height:32px;padding:0 26px 0 10px;border-radius:999px;border:1px solid var(--line-2);background-color:var(--card);color:var(--ink);font-size:12.5px;font-weight:700;letter-spacing:.04em;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 14px) 14px,calc(100% - 10px) 14px;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer;flex:none}
.cur-sel:focus{outline:none;border-color:var(--teal-ink);box-shadow:0 0 0 3px var(--teal-2)}
.fx-conv{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fx-cap{margin:10px 0 0;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.int-row{display:grid;grid-template-columns:1fr 92px 64px auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.int-row .input{height:40px;font-size:14px;padding:0 8px;text-align:center}
.int-row .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.int-row .switch{padding:0}
.int-row .switch input{width:44px;height:26px}
.int-row .switch input::after{width:20px;height:20px}
.int-row .switch input:checked::after{transform:translateX(18px)}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(10,14,15,.42);animation:fade .2s ease}
.sheet{position:relative;width:100%;max-width:440px;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);background:var(--bg);border-radius:26px 26px 0 0;box-shadow:var(--shadow-up);display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet.full{height:calc(100% - env(safe-area-inset-top,0px) - 12px)}
.sheet-grab{width:40px;height:5px;border-radius:5px;background:var(--line-2);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 18px 6px;flex:none}
.sheet-head h2{flex:1;margin:0;font-size:19px;font-weight:600;line-height:1.25}
.sheet-body{overflow-y:auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.detail{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px;margin:6px 0 4px}
.detail dt{color:var(--ink-2)}
.detail dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-word}
.copyline{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:10px 10px 10px 16px}
.copyline .v{flex:1;font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:.02em;user-select:all;-webkit-user-select:all;word-break:break-all}
.copyline .k{font-size:11.5px;color:var(--ink-2);font-weight:600}
.sos-big{display:flex;align-items:center;gap:16px;background:var(--bad-bg);border-radius:18px;padding:16px}
.sos-big .n{font-weight:200;font-size:54px;line-height:1;color:var(--bad-t);font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar-h) + 26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--on-ink);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 36px);text-align:center;animation:up .2s ease}

/* ---------- onboarding ---------- */
.onb-screen{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.onb-inner{position:relative;max-width:440px;min-height:100%;margin:0 auto;padding:0 18px;display:flex;flex-direction:column;overflow-x:clip;isolation:isolate}
.onb{flex:1;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(24px + env(safe-area-inset-bottom,0px));position:relative}
.onb .steps{display:flex;gap:6px;margin:6px 0 18px}
.onb .steps i{height:4px;flex:1;border-radius:4px;background:var(--line)}
.onb .steps i.on{background:var(--ink)}
.onb .foot{margin-top:auto;padding-top:22px;display:flex;flex-direction:column;gap:10px}
.welcome{isolation:isolate;display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding-top:24px;position:relative}
.welcome .big-mark{width:120px;height:120px}
/* переключатель языка на экранах приветствия: «RU · RO · EN» */
.onb-lang{display:flex;justify-content:flex-end;align-items:center;gap:8px;position:relative;z-index:2;margin:0 0 -8px}
/* тема: кнопка рядом с языком + маленькое меню (Системная / Светлая / Тёмная) */
.thm-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink);background:var(--bar-bg);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.thm-btn:hover{background:var(--teal-3)}
.thm-btn[aria-expanded="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.thm-menu{position:fixed;z-index:200;min-width:196px;padding:6px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;animation:thmIn .14s ease}
.thm-menu button{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 12px;border-radius:11px;font-size:14px;font-weight:600;color:var(--ink);text-align:left}
.thm-menu button:hover,.thm-menu button:focus-visible{background:var(--surface);outline:none}
.thm-menu button[aria-checked="true"]{color:var(--teal-ink)}
.thm-menu .ck{margin-left:auto}
@keyframes thmIn{from{opacity:0;transform:translateY(-4px)}}
.lang-pick{display:inline-flex;align-items:center;gap:1px;padding:3px;border-radius:999px;background:var(--bar-bg);border:1px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lang-pick .lp{min-width:40px;height:32px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-2)}
.lang-pick .lp[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.lang-pick .lp-dot{color:var(--ink-3);font-size:12px;line-height:1}
.welcome h1{font-weight:200;font-size:38px;line-height:1.08;margin:6px 0 0;letter-spacing:-.015em;text-wrap:balance}
.welcome ul{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:14px}
.welcome li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.4}

/* ---------- premium ---------- */
.pw-hero{isolation:isolate;position:relative;padding:8px 0 4px;overflow:hidden}
.pw-hero h2{font-weight:200;font-size:34px;line-height:1.08;margin:8px 0 6px;letter-spacing:-.015em}
.plans{display:flex;flex-direction:column;gap:10px}
.plan{position:relative;display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;border:1.5px solid var(--line-2);text-align:left;background:var(--card)}
.plan[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.plan .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center}
.plan[aria-checked="true"] .radio{border-color:var(--ink)}
.plan[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.plan .pn{font-weight:600;font-size:15px}
.plan .pd{font-size:12px;color:var(--ink-2);margin-top:2px}
.plan .pp{text-align:right;font-variant-numeric:tabular-nums}
.plan .pp b{display:block;font-size:17px}
.plan .pp span{font-size:11.5px;color:var(--ink-2)}
.plan .flag{position:absolute;top:-10px;right:14px;background:var(--teal);color:var(--on-teal);font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:999px;text-transform:uppercase}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:600;text-align:center;padding:8px 4px}
.cmp th:first-child{text-align:left}
.cmp td{padding:10px 4px;border-top:1px solid var(--line);text-align:center}
.cmp td:first-child{text-align:left;font-weight:500}
.cmp .yes{color:var(--ok-t)} .cmp .no{color:var(--ink-3)}
.cmp .ico{margin:0 auto}
.prem-card{isolation:isolate;display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-lg);background:var(--ink);color:var(--on-ink);width:100%;text-align:left;position:relative;overflow:hidden}
.prem-card .t{font-weight:600;font-size:15.5px}
.prem-card .s{font-size:12.5px;opacity:.75;margin-top:2px}
.prem-card .ring{z-index:-1;position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:1.5px solid var(--teal);opacity:.6}

/* ---------- report ---------- */
.report-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.score{display:flex;align-items:center;gap:14px}
.score svg{width:84px;height:84px;flex:none}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1.5px;background:var(--teal-2)}
.tl-i{position:relative;padding:8px 0 10px}
.tl-i::before{content:"";position:absolute;left:-21px;top:13px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--teal)}
.tl-i .d{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tl-i .w{font-weight:600;font-size:14px;margin-top:1px}
.tl-i .x{font-size:12.5px;color:var(--ink-2)}
.rtable{width:100%;border-collapse:collapse;font-size:13px}
.rtable td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
.rtable td:last-child{text-align:right}

/* partners */
.partner{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card)}
.partner .pn{font-weight:600}
.partner .po{font-size:13.5px}
.promo{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.08em;font-size:13px;background:var(--teal-3);padding:6px 10px;border-radius:8px;font-variant-numeric:tabular-nums}

/* loyalty */
.pts-card{position:relative;overflow:hidden;isolation:isolate}
.idcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card)}
.idcard:hover{border-color:var(--line-2)}
.idcard .qr{border-radius:8px;flex:none;box-shadow:0 0 0 1px var(--line)}
.hid{display:block;font-weight:600;font-size:18px;letter-spacing:.06em;font-variant-numeric:tabular-nums;margin:3px 0}
.coupon{display:grid;grid-template-columns:38px 1fr;gap:10px 12px;align-items:center;padding:14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card)}
.coupon .t{font-weight:600}
.coupon .foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.coupon .cost{font-weight:300;font-size:24px;font-variant-numeric:tabular-nums}
.earn{min-width:52px;height:30px;padding:0 8px;border-radius:999px;background:var(--teal-2);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.coupon-view{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.coupon-view .qr{border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.ccode{font-weight:300;font-size:38px;letter-spacing:.14em;line-height:1.1;font-variant-numeric:tabular-nums}
.pts-plus{color:var(--ok-t);font-weight:700}
.pts-minus{color:var(--ink-2);font-weight:700}
.tagchip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--teal-3);color:var(--ink);font-size:12px;font-weight:600}
.pitch{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:12px}
.pitch li{display:flex;gap:12px;align-items:center;font-size:14.5px;line-height:1.45}

.ic-circle.part{width:44px;height:44px}
.ic-circle.part.big{width:84px;height:84px}
.carviz{position:relative;padding:30px 0 34px}
.carimg{position:relative}
.carimg>svg{display:block;width:100%;height:auto}
.hs{position:absolute;z-index:2;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--card);box-shadow:0 2px 8px rgba(35,31,32,.18);display:grid;place-items:center}
.hs-ring{position:absolute;left:-4px;top:-4px;width:42px;height:42px;overflow:visible;pointer-events:none}
.hs-count{position:absolute;top:-8px;right:-8px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--ink);color:var(--on-ink);font-size:10px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.hs-pulse{position:absolute;left:-6px;top:-6px;width:46px;height:46px;border-radius:50%;border:2px solid var(--bad);opacity:.45;pointer-events:none;animation:hsPulse 1.8s ease-out infinite}
@keyframes hsPulse{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.55);opacity:0}}
.hs-lines{position:absolute;left:0;top:0;z-index:1;pointer-events:none;overflow:visible}
.hs-lines line{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 2}
.hs-chip{position:absolute;left:0;top:0;z-index:3;height:21px;padding:0 7px;border-radius:999px;background:var(--card);box-shadow:0 0 0 1px var(--line),0 1px 4px rgba(35,31,32,.12);font-size:10px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;color:var(--ink);font-variant-numeric:tabular-nums}
.carviz.narrow .hs-chip{font-size:9.5px;padding:0 6px;height:20px;gap:2px}
.hs-chip.bad b{color:var(--bad-t)} .hs-chip.soon b{color:var(--soon-t)} .hs-chip.ok b{color:var(--ok-t)}
.wear-line{display:flex;align-items:center;gap:8px;margin-top:6px}
.wear-line .bar{flex:1;margin:0}
.bar.est>i{background:repeating-linear-gradient(90deg,var(--ok) 0 6px,transparent 6px 9px)}
.bar.soon.est>i{background:repeating-linear-gradient(90deg,var(--soon) 0 6px,transparent 6px 9px)}
.part-hero{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.wear-big{font-weight:200;font-size:54px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wear-big small{font-size:20px;font-weight:300;margin-left:3px;letter-spacing:0}
.kb-sum{margin-top:14px;padding:14px;border-radius:var(--r-md);background:var(--surface)}
.kb-sum .clamp{margin:4px 0 12px;font-size:13.5px;line-height:1.5;font-weight:400;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.score-row{display:flex;align-items:center;gap:16px}
.score-row>svg{width:84px;height:84px;flex:none}
.sys-h{font-size:12.5px;font-weight:600;color:var(--ink-2);margin:18px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:14px;background:var(--surface);text-align:center;min-width:0}
.tile:hover{background:var(--teal-3)}
.tl-n{font-size:11px;font-weight:600;line-height:1.2;min-height:27px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;hyphens:auto;overflow-wrap:anywhere}
.tl-st{font-size:10.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--none)}
.dot.ok{background:var(--ok)} .dot.soon{background:var(--soon)} .dot.bad{background:var(--bad)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

.sync-bad{color:var(--bad-t)}
#app-ver{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* Helper-код: карточка на главной, полноэкранный показ кассиру */
.hidc{display:flex;gap:14px;align-items:center;margin-top:14px;padding:12px 14px 12px 12px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);width:100%;text-align:left}
.hidc .qrbox{flex:none;display:block;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line);line-height:0}
.hidc .body{flex:1;min-width:0}
.hidc .hid{font-size:17px;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hidc .pts{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hidc .btn{margin-top:8px}
.hidc.cta{background:var(--teal-3);color:var(--ink);border-color:transparent;box-shadow:none}
.hidc.cta .s{font-size:12px;color:var(--ink-2);margin-top:2px;display:block}
.hidc.cta .t{font-weight:600;font-size:14px;line-height:1.3;display:block}
.hidc.cta .go{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
.codefs{outline:none;position:fixed;inset:0;z-index:95;background:#FFFFFF;color:#231F20;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fade .15s ease}
.codefs-in{min-height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:calc(64px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px))}
.codefs .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(14px,calc(50% - 206px));width:44px;height:44px;border-radius:50%;background:#EEF2F2;color:#231F20;display:grid;place-items:center}
.codefs .ttl{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#56605F;margin:0}
.codefs .sub{font-size:15px;font-weight:600;margin:0;color:#231F20}
.codefs .qr{width:min(78vw,320px);height:auto;display:block}
.codefs .bc{max-width:100%;height:78px;display:block}
.codefs .big{font-size:clamp(28px,9vw,38px);font-weight:600;letter-spacing:.1em;line-height:1.1;font-variant-numeric:tabular-nums;margin:0;user-select:all;-webkit-user-select:all;color:#000}
.codefs .hint{font-size:15px;line-height:1.45;margin:0;max-width:330px;color:#231F20}
.codefs .note{font-size:12.5px;color:#56605F;margin:0;max-width:320px}
.codefs .btn{background:#231F20;color:#FFFFFF;min-width:220px}
/* Акции партнёров */
.ostrip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 6px;scroll-snap-type:x proximity;scroll-padding:0 18px}
.ostrip::-webkit-scrollbar{display:none}
.offer{flex:none;width:min(248px,72vw);scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);text-align:left;position:relative}
.offer:hover{border-color:var(--line-2)}
.offer.wide{width:100%}
.offer .oh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.offer .ocat{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offer .ot{font-weight:600;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.offer .oc{font-size:12.5px;color:var(--ink-2)}
.offer .od{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;margin-top:auto}
.obadge{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--teal);color:var(--on-teal);font-size:12px;font-weight:700;white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.oempty{display:flex;gap:12px;align-items:center}
.oloc{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.oloc .body{flex:1;min-width:0}
.oloc .t{font-weight:600;font-size:14px}
.oloc .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.obanner{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:420px;z-index:92;background:var(--ink);color:var(--on-ink);border-radius:18px;padding:12px 10px 12px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);animation:fade .25s ease}
.obanner .body{flex:1;min-width:0;text-align:left}
.obanner .t{font-weight:600;font-size:13.5px;line-height:1.3;display:block}
.obanner .s{font-size:12px;opacity:.75;display:block;margin-top:2px}
.obanner .iconbtn{background:transparent;color:var(--on-ink)}
/* сканер техпаспорта: карточка онбординга и прогресс */
.scan-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:18px;border-radius:var(--r-lg);background:var(--ink);color:var(--on-ink);position:relative;overflow:hidden;isolation:isolate}
.scan-card .ring{z-index:-1;position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;border:1.5px solid var(--teal);opacity:.7}
.scan-card .t{font-weight:600;font-size:18px;line-height:1.25;margin:0}
.scan-card .s{font-size:13.5px;opacity:.78;margin:0;line-height:1.45}
.scan-card .btn{background:var(--teal);color:var(--on-teal);margin-top:4px}
.scan-safe{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-2);margin:10px 2px 0;line-height:1.45}
.scan-prog .bar{height:8px;margin:14px 0 10px}
.scan-prog .bar>i{background:var(--teal-ink);transition:width .3s}
/* ---------- Игра: километры Helper, уровень, серии, задания, значки, плюшки партнёров ---------- */
.kmh{display:inline-flex;align-items:center;gap:.26em;white-space:nowrap;font-variant-numeric:tabular-nums}
.kmh>svg.mark{width:.95em;height:.95em;flex:none}
.kmh.lg>svg.mark{width:.6em;height:.6em}
.btn.ink .kmh>svg.mark g,.gbanner .kmh>svg.mark g{stroke:var(--teal)}
.kmh-u{font-size:.5em;font-weight:500;color:var(--ink-2);letter-spacing:0;margin-left:.1em}
.g-hero{position:relative;overflow:hidden;isolation:isolate;border-radius:var(--r-xl);padding:18px 16px 16px;background:var(--teal-3);margin-top:8px}
.g-hero .corner-ring{z-index:-1}
.lvl{display:flex;align-items:center;gap:14px}
.lvl-badge{position:relative;width:62px;height:62px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 3px var(--teal),0 1px 2px rgba(35,31,32,.06);font-weight:300;font-size:28px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.lvl-badge.sm{width:34px;height:34px;font-size:15px;font-weight:600;box-shadow:inset 0 0 0 2px var(--teal)}
.lvl-badge.xl{width:132px;height:132px;font-size:64px;font-weight:200;box-shadow:inset 0 0 0 5px var(--teal)}
.lvl-name{font-weight:600;font-size:20px;line-height:1.2;margin:2px 0 0}
.xpbar{height:8px;border-radius:8px;background:var(--card);overflow:hidden;margin-top:14px}
.xpbar>i{display:block;height:100%;border-radius:8px;background:var(--teal-ink);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xpline{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.g-stats{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px;margin-top:14px}
.g-stat{background:var(--card);border-radius:var(--r-md);padding:12px 14px;min-width:0;text-align:left}
.g-stat .k{font-size:11.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.g-stat .v{display:block;font-weight:300;font-size:28px;line-height:1.1;margin-top:6px;letter-spacing:-.01em}
.g-stat .s{display:block;font-size:11.5px;color:var(--ink-2);margin-top:6px;line-height:1.35}
.g-note{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-2);margin:12px 2px 0;line-height:1.45}
.g-note .ico{color:var(--ink-3);margin-top:1px}
.streaks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.streak{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.streak .top{display:flex;align-items:center;gap:8px}
.streak .n{font-weight:200;font-size:38px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.streak .u{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.25}
.streak .fl{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soon-bg);color:var(--soon-t);flex:none}
.streak .fl.off{background:var(--surface);color:var(--ink-3)}
.streak .fl.care{background:var(--teal-3);color:var(--teal-ink)}
.weeks{display:flex;gap:4px}
.weeks i{flex:1;height:6px;border-radius:6px;background:var(--surface)}
.weeks i.on{background:var(--soon)}
.weeks i.now{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.weeks i.frz{background:var(--teal-2)}
.weeks.care i.on{background:var(--teal-ink)}
.frz{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.frz .ico{color:var(--teal-ink)}
.frz.off .ico{color:var(--ink-3)}
.quest{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 14px 6px}
.quest+.quest{margin-top:10px}
.quest .qh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.quest p{margin:0}
.quest .qk{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.quest .qt{font-weight:600;font-size:15.5px;line-height:1.3;margin-top:3px}
.quest .qd{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.quest .qp{font-size:12px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.quest .bar{height:6px;margin-top:10px}
.quest .bar>i{background:var(--teal-ink)}
.quest.done .bar>i{background:var(--ok)}
.rw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rw>span{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:3px 9px;border-radius:12px;background:var(--teal-3);font-size:12px;font-weight:600;line-height:1.3;max-width:100%}
.qsteps{margin-top:8px;border-top:1px solid var(--line)}
.qstep{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0;text-align:left;font-size:13.5px;font-weight:500;line-height:1.3;min-height:44px}
.qstep+.qstep{border-top:1px solid var(--line)}
.qstep .ck{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line-2);color:transparent}
.qstep.done .ck{background:var(--ok);box-shadow:none;color:#fff}
.qstep.done .tx{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.qstep .tx{flex:1;min-width:0}
.qstep .cnt{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qstep .go{color:var(--teal-ink);flex:none}
button.qstep:hover .tx{color:var(--teal-ink)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;padding:2px}
.bdg .bi{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--teal-3);color:var(--ink);box-shadow:inset 0 0 0 2px var(--teal)}
.bdg .bn{font-size:10.5px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;hyphens:auto}
.bdg.off .bi{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--line-2);border:0}
.bdg.off .bn{color:var(--ink-3)}
.earn-t{width:100%;border-collapse:collapse;font-size:13px}
.earn-t th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600;text-align:right;padding:0 0 6px 6px;white-space:nowrap}
.earn-t th:first-child{text-align:left;padding-left:0}
.earn-t td{padding:9px 0 9px 6px;border-top:1px solid var(--line);vertical-align:top;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.earn-t td:first-child{text-align:left;white-space:normal;font-weight:500;padding-left:0}
.earn-t td small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:500;margin-top:1px}
.gstrip{display:block;width:100%;text-align:left;margin-top:12px;padding:12px 14px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line)}
.gstrip:hover{border-color:var(--line-2)}
.gstrip .r1{display:flex;align-items:center;gap:10px;min-width:0}
.gstrip .ln{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gstrip .sp{flex:1}
.gstrip .kv{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.gstrip .kv .ico{color:var(--soon)}
.gstrip .r2{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2)}
.gstrip .r2 .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gstrip .r2 b{color:var(--ink);font-weight:600}
.pstrip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 6px;scroll-snap-type:x proximity;scroll-padding:0 18px}
.pstrip::-webkit-scrollbar{display:none}
.perk{display:flex;flex-direction:column;gap:8px;width:100%;padding:14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);text-align:left;position:relative}
.perk:hover{border-color:var(--line-2)}
.pstrip{align-items:flex-start}
.pstrip .perk{flex:none;width:min(252px,74vw);scroll-snap-align:start}
.perk .ph{display:flex;align-items:center;gap:10px;min-width:0}
.perk .pk{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--teal-3);color:var(--ink);flex:none}
.perk .pk.helper{background:var(--ink);color:var(--on-ink)}
.perk .pc{flex:1;min-width:0}
.perk .pco{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.perk .pm{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:1px}
.perk .pt{font-weight:600;font-size:15px;line-height:1.3}
.perk .pf{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:auto}
.perk .price{font-weight:300;font-size:24px;line-height:1;letter-spacing:-.01em}
.perk .tags{display:flex;flex-wrap:wrap;gap:6px}
.perk.locked .pt,.perk.locked .price{color:var(--ink-2)}
.ptag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:11px;font-weight:700;white-space:nowrap}
.ptag.hh{background:var(--teal-2);color:var(--ink)}
.ptag.lock{background:var(--ink);color:var(--on-ink)}
.ptag.low{background:var(--soon-bg);color:var(--soon-t)}
.plvl{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--surface);color:var(--ink-2)}
.plvl.silver{background:#E8ECEE;color:#4E5A60}.plvl.gold{background:#F6EBC8;color:#7A5A00}.plvl.platinum{background:#DCEFEE;color:#1F6E69}.plvl.bronze{background:#F3E3D6;color:#7A4A26}
.rate{display:inline-flex;align-items:center;gap:3px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.rate .ico{width:13px;height:13px;fill:var(--soon);stroke:var(--soon)}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.stars button{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:var(--line-2)}
.stars button .ico{width:34px;height:34px;stroke-width:1.4}
.stars button.on{color:var(--soon)}
.stars button.on .ico{fill:currentColor}
.celeb{outline:none;position:fixed;inset:0;z-index:96;background:var(--bg);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fade .3s ease;isolation:isolate}
.celeb-in{position:relative;min-height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:calc(56px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));overflow:hidden}
.celeb .rings{position:relative;width:200px;height:200px;display:grid;place-items:center;margin:34px 0 40px}
.celeb .rings i{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--teal-2);animation:ringIn 1.4s cubic-bezier(.2,.8,.2,1) both}
.celeb .rings i:nth-child(2){inset:-30px;border-color:var(--teal-2);opacity:.7;animation-delay:.12s}
.celeb .rings i:nth-child(3){inset:-58px;opacity:.45;animation-delay:.24s}
.celeb .rings .lvl-badge{animation:popIn .7s cubic-bezier(.2,.8,.2,1) .15s both}
.celeb .ey{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-ink);margin:0}
.celeb h2{font-weight:200;font-size:40px;line-height:1.05;letter-spacing:-.015em;margin:0;text-wrap:balance}
.celeb .lead{font-size:15px;color:var(--ink-2);margin:0;max-width:320px;line-height:1.5}
.celeb ul{list-style:none;padding:0;margin:10px 0 6px;display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;text-align:left}
.celeb li{display:flex;gap:12px;align-items:center;font-size:14.5px;line-height:1.4;padding:12px 14px;border-radius:var(--r-md);background:var(--teal-3)}
.celeb .btn{min-width:220px;margin-top:10px}
.celeb .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%;background:var(--surface);display:grid;place-items:center;z-index:2}
@keyframes ringIn{from{transform:scale(.55);opacity:0}to{transform:none}}
@keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.gbanner{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:420px;z-index:93;background:var(--ink);color:var(--on-ink);border-radius:18px;padding:12px 10px 12px 12px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);animation:bannerIn .35s cubic-bezier(.2,.8,.2,1)}
.gbanner .gi{width:40px;height:40px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;flex:none}
.gbanner .body{flex:1;min-width:0;text-align:left}
.gbanner .t{font-weight:600;font-size:13.5px;line-height:1.3;display:block}
.gbanner .s{font-size:12px;opacity:.78;display:block;margin-top:2px}
.gbanner .iconbtn{background:transparent;color:var(--on-ink)}
@keyframes bannerIn{from{transform:translate(-50%,-14px);opacity:0}to{transform:translateX(-50%);opacity:1}}
.cpn-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}
.codefs .btn.line{background:transparent;color:#231F20;border:1.5px solid #CFDBDA}
</style>
</head>
<body>
<div class="notch" aria-hidden="true"></div>
<div id="app" lang="ru"><main id="view" aria-live="off"></main></div>
<div id="onb" class="onb-screen" hidden></div>
<nav id="tabbar" class="tabbar"></nav>
<button id="fab" class="fab" type="button" data-act="rec-new" hidden></button>
<div id="sheet" class="sheet-wrap" hidden></div>

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
/* числа — в формате активной локали (NF0/NF1/NF2 пересобираются при смене языка, см. i18nApply) */
const fN = n => NF0.format(Math.round(n || 0));
const f1 = n => NF1.format(n || 0);
const f2 = n => NF2.format(n || 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
/* Ввод чисел: пробелы — разделители тысяч; «86.400» (ro) и «86,400» (en) с разделителем групп локали — тоже тысячи; иначе запятая = точка */
function parseNum(v) {
  if (v == null) return null;
  let s = String(v).replace(/[\s\u00a0\u202f]/g, '');
  if (s === '') return null;
  const g = LANG === 'en' ? ',' : LANG === 'ro' ? '.' : null;
  if (g && new RegExp('^-?\\d{1,3}(\\' + g + '\\d{3})+$').test(s)) s = s.split(g).join('');
  const n = Number(s.replace(',', '.'));
  return isFinite(n) ? n : null;
}

/* dates: ISO 'YYYY-MM-DD' strings, local time; вывод — Intl активной локали (DF, UF, RTF — см. i18nApply) */
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => iso(new Date());
const pd = s => { const a = String(s).split('-').map(Number); return new Date(a[0], (a[1] || 1) - 1, a[2] || 1); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
function addMonths(s, n) { const d = pd(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return iso(d); }
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 86400000);
const fD = s => { if (!s) return '—'; return DF.d.format(pd(s)); };          /* 05.01.2025 · 05/01/2025 */
const fDs = s => DF.s.format(pd(s));                                         /* 5 янв. · 5 ian. · 5 Jan */
const fDl = s => DF.l.format(pd(s));                                         /* 5 января 2025 · 5 ianuarie 2025 · 5 January 2025 */
const fMonY = s => DF.my.format(pd(s));                                      /* янв. 2025 · ian. 2025 · Jan 2025 */
const fMonYL = s => DF.m.format(pd(s));                                      /* январь 2025 · ianuarie 2025 · January 2025 */
const monShort = i => DF.ms.format(new Date(2000, i, 1)).replace(/\.$/, ''); /* подпись месяца на графике: янв · ian · Jan */
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fMonth = key => { const a = key.split('-'); return cap(DF.m.format(new Date(+a[0], +a[1] - 1, 1))); }; /* Январь 2025 */
/* «5 дней» · «5 zile» · «21 de zile» · «5 days»; «4 месяца» · «4 luni»; «86 400 км» · «86.400 km» */
const fDays = n => UF.day ? UF.day.format(n) : n + ' d';
const fMonths = n => UF.month ? UF.month.format(n) : n + ' m';
const kmTxt = n => t('u.km', {n: fN(n)});                                   /* пробег/расстояние в км: «86 400 км» */
/* сегодня / завтра / через 3 дня / 5 дней назад — на активном языке */
function relDays(n) { if (RTF) return RTF.format(n, 'day'); return n === 0 ? t('d.today') : n > 0 ? '+' + fDays(n) : '−' + fDays(-n); }
function approx(days) {
  days = Math.abs(days);
  if (days < 14) return fDays(days);
  if (days < 60) return UF.week ? UF.week.format(Math.round(days / 7)) : fDays(days);
  if (days < 700) return UF.monthS ? UF.monthS.format(Math.round(days / 30.44)) : fDays(days);
  return UF.year ? UF.year.format(Math.round(days / 365.25 * 10) / 10) : fDays(days);
}

/* ================= service computations ================= */
function cfgFor(item) {
  const o = S.settings.intervals[item.id] || {};
  return {km: o.km != null ? o.km : item.km, mo: o.mo != null ? o.mo : item.mo, off: !!o.off};
}
function itemApplies(item, car) { return item.not.indexOf(car.fuel) < 0 && !cfgFor(item).off; }
function lastFor(item, car) { return carRecs(car.id).filter(r => item.cats.indexOf(r.cat) >= 0).sort(byDateDesc)[0] || null; }
function computeItem(item, car, kpd) {
  const T = todayISO(), cfg = cfgFor(item), last = lastFor(item, car);
  const res = {item, last, cfg, remKm: null, remDays: null, dueKm: null, dueDate: null, est: false, frac: null, status: 'none', eta: null};
  if (item.season) return seasonItem(res, car, T);
  if (cfg.km) {
    if (last && last.odo != null) res.dueKm = last.odo + cfg.km;
    else { res.dueKm = Math.ceil((car.odo + 1) / cfg.km) * cfg.km; res.est = true; }
    res.remKm = res.dueKm - car.odo;
  }
  if (cfg.mo && last && !last.baseline) { res.dueDate = addMonths(last.date, cfg.mo); res.remDays = diffDays(T, res.dueDate); }
  const fr = [];
  if (res.remKm != null) fr.push(res.remKm / cfg.km);
  if (res.remDays != null) fr.push(res.remDays / (cfg.mo * 30.44));
  if (!fr.length) return res;
  res.frac = Math.min.apply(null, fr);
  if (res.remKm != null && kpd) res.eta = Math.round(res.remKm / kpd);
  if ((res.remKm != null && res.remKm < 0) || (res.remDays != null && res.remDays < 0)) res.status = 'bad';
  else if ((res.remKm != null && res.remKm <= Math.min(2000, cfg.km * 0.2)) || (res.remDays != null && res.remDays <= 30)) res.status = 'soon';
  else res.status = 'ok';
  return res;
}
function seasonItem(res, car, T) {
  const d = pd(T), y = d.getFullYear(), m = d.getMonth() + 1;
  const tires = carRecs(car.id).filter(r => r.cat === 'tires').sort(byDateDesc);
  const lastT = tires[0]; res.last = lastT || null;
  if (lastT && lastT.ex && lastT.ex.season === 'all') { res.status = 'ok'; res.frac = 1; res.allSeason = true; return res; }
  let needed, start, neededDue, next, nextDue;
  if (m >= 4 && m <= 10) { needed = 'summer'; start = y + '-03-01'; neededDue = y + '-04-30'; next = 'winter'; nextDue = y + '-11-01'; }
  else { const sy = m >= 11 ? y : y - 1; needed = 'winter'; start = sy + '-10-01'; neededDue = sy + '-11-30'; next = 'summer'; nextDue = (sy + 1) + '-04-01'; }
  const done = tires.some(r => r.ex && r.ex.season === needed && r.date >= start);
  if (!done && lastT && lastT.ex && lastT.ex.season && lastT.ex.season !== needed) {
    res.target = needed; res.dueDate = neededDue; res.remDays = diffDays(T, neededDue);
    res.status = res.remDays < 0 ? 'bad' : 'soon'; res.frac = res.remDays / 183; return res;
  }
  res.target = next; res.dueDate = nextDue; res.remDays = diffDays(T, nextDue);
  res.status = res.remDays <= 30 ? 'soon' : 'ok'; res.frac = Math.min(1, res.remDays / 183);
  return res;
}
const ST_RANK = {bad: 0, soon: 1, ok: 2, none: 3};
function serviceList(car) {
  const kpd = kmPerDay(car);
  return ITEMS.filter(i => itemApplies(i, car)).map(i => computeItem(i, car, kpd))
    .sort((a, b) => ST_RANK[a.status] - ST_RANK[b.status] || (a.frac == null ? 1 : b.frac == null ? -1 : a.frac - b.frac));
}
const ST_LABEL = {ok: '', soon: '', bad: '', none: ''};
onLang(() => { for (const k in ST_LABEL) ST_LABEL[k] = t('st.' + k); });
const stCls = s => ({ok: 'st-ok', soon: 'st-soon', bad: 'st-bad', none: 'st-none'}[s]);
/* «на зимние» / «на летние» — цель сезонной смены шин */
const seasonTarget = x => t(x.target === 'winter' ? 'svc.toWinter' : 'svc.toSummer');
function svcText(x) {
  if (x.item.season) {
    if (x.allSeason) return t('svc.allSeason');
    const tt = seasonTarget(x);
    if (x.remDays < 0) return t('svc.seasonOverdue', {target: tt, over: approx(-x.remDays)});
    return tt + ' · ' + relDays(x.remDays) + ' (' + fDs(x.dueDate) + ')';
  }
  const bits = [];
  if (x.remKm != null) bits.push(x.remKm >= 0 ? t('svc.left', {v: kmTxt(x.remKm)}) : t('svc.over', {v: kmTxt(-x.remKm)}));
  if (x.remDays != null) bits.push(x.remKm == null ? (x.remDays >= 0 ? t('svc.left', {v: approx(x.remDays)}) : t('svc.over', {v: approx(-x.remDays)})) : t('c.until', {date: fD(x.dueDate)}));
  if (x.est) bits.push(t('svc.byPlan'));
  if (!bits.length) return t('svc.noRecord');
  return bits.join(' · ');
}

/* ================= money =================
   Каждая денежная запись (ТО, заправка, документ) хранит currency — валюту, в которой сумма введена; car.currency — валюта
   показа. Все суммы на экранах — в валюте показа, пересчёт на лету через EUR по курсу fxData() (блок «Курсы валют»):
   сумма / rates[валюта записи] × rates[валюта показа]. Запись в валюте показа — точное исходное число; сохранённые суммы не меняются. */
const entCur = (e, car) => e && CUR.indexOf(e.currency) >= 0 ? e.currency : (car && car.currency) || 'MDL';
const toDisp = (n, e, car) => fxConv(n, entCur(e, car), car.currency);
const recAmt = (r, car) => toDisp(recTotal(r), r, car);
const fuelAmt = (f, car) => toDisp(f.liters * f.price, f, car);
const fM = n => Math.abs((+n || 0) % 1) < 0.005 ? fN(n) : f2(n); /* 820 · 49,70 */
const moneyIn = (n, cur) => fM(n) + ' ' + cur;
const approxMark = (e, car) => entCur(e, car) !== car.currency ? '≈ ' : '';
function expenseEntries(car) {
  const out = [];
  carRecs(car.id).forEach(r => { const a = recAmt(r, car); if (a > 0) out.push({date: r.date, amt: a, g: expGroup(r.cat), kind: 'rec'}); });
  carFuel(car.id).forEach(f => out.push({date: f.date, amt: fuelAmt(f, car), g: 'fuel', kind: 'fuel'}));
  carDocs(car.id).forEach(d => { if (d.cost > 0) out.push({date: d.issued || d.expires, amt: toDisp(d.cost, d, car), g: 'docs', kind: 'doc'}); });
  return out;
}
function periodFrom(p) { const T = todayISO(); return p === 'month' ? addDays(T, -30) : p === 'year' ? addDays(T, -365) : null; }
function fuelSegments(car) {
  const f = carFuel(car.id).slice().sort((a, b) => a.odo - b.odo || (a.date < b.date ? -1 : 1));
  const segs = []; let lastFull = null, acc = 0;
  for (const x of f) {
    if (!lastFull) { if (x.full) { lastFull = x; acc = 0; } continue; }
    acc += x.liters;
    if (x.full) { const dist = x.odo - lastFull.odo; if (dist >= 50) segs.push({id: x.id, date: x.date, odo: x.odo, dist, liters: acc, cons: acc / dist * 100}); lastFull = x; acc = 0; }
  }
  return segs;
}
const money = (n, car) => fN(n) + ' ' + ((car || activeCar()) ? (car || activeCar()).currency : 'MDL');

function lineChart(segs, unit) {
  const pts = segs.slice(-14);
  if (pts.length < 2) return '<div class="empty small">' + t('chart.consEmpty') + '</div>';
  const W = 340, H = 176, L = 30, R = 12, T = 14, B = 26;
  const vals = pts.map(p => p.cons);
  let lo = Math.floor(Math.min.apply(null, vals) - 0.4), hi = Math.ceil(Math.max.apply(null, vals) + 0.4);
  if (hi - lo < 2) hi = lo + 2;
  const X = i => L + (W - L - R) * i / (pts.length - 1), Y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  const ticks = [lo, (lo + hi) / 2, hi];
  let g = ticks.map(tt => '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(tt).toFixed(1) + '" y2="' + Y(tt).toFixed(1) + '"/><text x="' + (L - 6) + '" y="' + (Y(tt) + 3.5).toFixed(1) + '" text-anchor="end">' + f1(tt).replace(/[.,]0$/, '') + '</text>').join('');
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.cons).toFixed(1)).join('');
  const area = line + 'L' + X(pts.length - 1).toFixed(1) + ' ' + (H - B) + 'L' + L + ' ' + (H - B) + 'Z';
  const lab = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].map(i => '<text x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle') + '">' + fDs(pts[i].date) + '</text>').join('');
  const dots = pts.map((p, i) => {
    const last = i === pts.length - 1, tip = t('chart.consTip', {date: fD(p.date), cons: f1(p.cons), unit, dist: kmTxt(p.dist), vol: f1(p.liters)});
    return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.cons).toFixed(1) + '" r="' + (last ? 5 : 3.2) + '" fill="' + (last ? 'var(--c1)' : 'var(--card)') + '" stroke="var(--c1)" stroke-width="2"/>' +
      '<circle class="hit" data-tip="' + esc(tip) + '" data-cap="cap-cons" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.cons).toFixed(1) + '" r="13" fill="transparent" tabindex="0"/>';
  }).join('');
  const ay = Y(avg).toFixed(1);
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('chart.consAria', {n: pts.length, avg: f1(avg), unit}) + '">' + g +
    '<path d="' + area + '" fill="var(--teal-2)" opacity=".45"/>' +
    '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + ay + '" y2="' + ay + '" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 4"/>' +
    '<path d="' + line + '" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' + dots + lab + '</svg>' +
    '<div class="chart-cap" id="cap-cons">' + t('chart.consCap', {avg: f1(avg), unit}) + '</div>';
}
function donut(groups, total, car) {
  const r = 46, C = 2 * Math.PI * r, gap = groups.length > 1 ? 2.2 : 0;
  let off = 0;
  const segs = groups.map(g => {
    const len = g.amt / total * C, dl = Math.max(len - gap, 0.6);
    const s = '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="var(' + g.c + ')" stroke-width="18" stroke-dasharray="' + dl.toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 60 60)"><title>' + esc(g.n) + ': ' + money(g.amt, car) + '</title></circle>';
    off += len; return s;
  }).join('');
  return '<svg viewBox="0 0 120 120" width="132" height="132" role="img" aria-label="' + t('chart.donutAria') + '">' + segs +

function shortMoney(n) { return n >= 100000 ? f1(n / 1000).replace(/[.,]0$/, '') + 'k' : fN(n); }
function monthBars(car) {
  const T = pd(todayISO()), months = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(T.getFullYear(), T.getMonth() - i, 1); months.push({key: d.getFullYear() + '-' + pad(d.getMonth() + 1), fuel: 0, other: 0}); }
  const M = Object.fromEntries(months.map(m => [m.key, m]));
  expenseEntries(car).forEach(e => { const m = M[e.date.slice(0, 7)]; if (m) { if (e.g === 'fuel') m.fuel += e.amt; else m.other += e.amt; } });
  const max = Math.max.apply(null, months.map(m => m.fuel + m.other).concat([1]));
  const step = niceStep(max / 2), top = Math.ceil(max / step) * step;
  const W = 340, H = 170, L = 34, R = 6, T0 = 10, B = 24, bw = (W - L - R) / 12;
  const Y = v => T0 + (H - T0 - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top + 0.1; v += step) g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/><text x="' + (L - 6) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + (v >= 1000 ? f1(v / 1000).replace(/[.,]0$/, '') + 'k' : fN(v)) + '</text>';
  const bars = months.map((m, i) => {

    const tip = t('chart.monthTip', {month: fMonth(m.key), total: fN(m.fuel + m.other), cur, fuel: fN(m.fuel), other: fN(m.other)});
    let s = '';
    if (m.fuel > 0) s += '<rect x="' + x.toFixed(1) + '" y="' + yF.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + (Y(0) - yF).toFixed(1) + '" rx="2.5" fill="var(--c1)"/>';
    if (m.other > 0) s += '<rect x="' + x.toFixed(1) + '" y="' + yO.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(Y(m.fuel) - yO - 2, 1.5).toFixed(1) + '" rx="2.5" fill="var(--c2)"/>';
    s += '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + monShort(+m.key.slice(5) - 1).slice(0, 3) + '</text>'; /* 3 буквы: «нояб», «Sept» не помещаются в столбец */
    s += '<rect class="hit" data-tip="' + esc(tip) + '" data-cap="cap-month" x="' + (x - 3).toFixed(1) + '" y="' + T0 + '" width="' + bw.toFixed(1) + '" height="' + (H - T0 - B) + '" fill="transparent" tabindex="0"/>';
    return s;
  }).join('');
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('chart.monthAria') + '">' + g + bars + '</svg>' +
    '<div class="row small" style="gap:16px;margin-top:8px"><span class="row" style="gap:6px"><i class="sw" style="width:10px;height:10px;border-radius:3px;background:var(--c1);display:inline-block"></i>' + t('c.fuel') + '</span><span class="row" style="gap:6px"><i style="width:10px;height:10px;border-radius:3px;background:var(--c2);display:inline-block"></i>' + t('chart.svcDocs') + '</span></div>' +
    '<div class="chart-cap" id="cap-month">' + t('chart.monthCap') + '</div>';
}
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1)))), n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

function reportData(car) {
  const recs = carRecs(car.id).filter(r => !r.baseline).sort(byDateDesc);
  const list = serviceList(car).filter(x => !x.item.season);
  const good = list.filter(x => x.last && !x.est && x.status !== 'bad').length;
  const score = list.length ? good / list.length * 100 : 0;
  const oils = recs.filter(r => r.cat === 'oil').sort((a, b) => a.odo - b.odo);
  let oilAvg = null; if (oils.length > 1) oilAvg = (oils[oils.length - 1].odo - oils[0].odo) / (oils.length - 1);
  const invested = recs.reduce((a, r) => a + recAmt(r, car), 0);
  const code = 'HLP-R-' + hash6(car.id + '|' + recs.map(r => r.date + r.odo + r.cat).join(';'));
  return {recs, list, good, score, oilAvg, invested, code, since: recs.length ? recs[recs.length - 1].date : null};
}
